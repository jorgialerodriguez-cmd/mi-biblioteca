<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookFlix</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">

    <style>
        /* --- ESTÉTICA EXACTA DE TUS CAPTURAS --- */
        :root { --bg: #000000; --card-bg: #1e1e1e; --accent: #e50914; --text: #ffffff; --gray: #b3b3b3; }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; margin: 0; padding: 0; padding-bottom: 80px; }

        /* HEADER / BARRA SUPERIOR */
        .top-bar { display: flex; align-items: center; padding: 15px; gap: 10px; position: sticky; top: 0; background: var(--bg); z-index: 100; }
        .filter-btn { background: #1e1e1e; border: none; color: white; padding: 12px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .search-input { flex: 1; background: #1e1e1e; border: none; color: white; padding: 12px 15px; border-radius: 8px; font-size: 16px; outline: none; }
        .search-input::placeholder { color: #666; }

        /* GRID DE LIBROS */
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 15px; }
        .book-card { display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
        .cover-img { width: 100%; aspect-ratio: 2/3; object-fit: cover; border-radius: 6px; background: #1e1e1e; }
        .book-title { font-size: 15px; font-weight: bold; margin: 0; line-height: 1.2; }
        .book-author { font-size: 13px; color: var(--gray); margin: 0; text-transform: uppercase; }
        
        /* TARJETA "AÑADIR" (DASHED) */
        .add-card { border: 2px dashed #333; border-radius: 6px; aspect-ratio: 2/3; display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--gray); cursor: pointer; }
        .add-icon { font-size: 40px; margin-bottom: 5px; }

        /* BARRA DE NAVEGACIÓN INFERIOR (FIJA) */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #000; border-top: 1px solid #1e1e1e; display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; padding-bottom: 15px; }
        .nav-item { display: flex; flex-direction: column; align-items: center; background: none; border: none; color: #555; font-size: 10px; gap: 4px; cursor: pointer; width: 20%; }
        .nav-item.active { color: white; }
        .nav-item .material-icons-round { font-size: 24px; }

        /* --- VISTA DETALLE (Overlay Completo) --- */
        #detail-view { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 2000; display: none; flex-direction: column; overflow-y: auto; }
        
        /* Cabecera Detalle */
        .detail-header { display: flex; justify-content: space-between; padding: 20px; align-items: center; position: absolute; width: 100%; top: 0; z-index: 10; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent); }
        .close-btn { background: none; border: none; color: white; font-size: 16px; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .detail-label { color: #666; font-size: 12px; font-weight: bold; letter-spacing: 1px; }

        /* Contenido Detalle */
        .detail-content { padding: 20px; padding-top: 80px; display: flex; flex-direction: column; gap: 20px; }
        .detail-cover-area { display: flex; justify-content: center; margin-bottom: 10px; }
        .detail-cover { width: 160px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .detail-info { text-align: center; }
        .dt-title { font-size: 28px; font-weight: bold; margin: 0 0 5px 0; }
        .dt-author { font-size: 16px; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin: 0; }

        /* Botones de Acción Circulares */
        .action-row { display: flex; justify-content: center; gap: 20px; margin: 15px 0; }
        .circle-btn { width: 45px; height: 45px; border-radius: 50%; border: 1px solid #333; background: transparent; color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
        .circle-btn.active { background: white; color: black; border-color: white; }
        .circle-btn.active-bookmark { background: white; color: black; border-color: white; }
        .circle-btn.active-clock { background: #333; color: #3498db; border-color: #3498db; }

        /* Estrellas */
        .star-row { display: flex; justify-content: center; gap: 5px; font-size: 24px; color: #333; margin-bottom: 5px; }
        .star-fill { color: #ffd700; }

        /* Metadatos */
        .meta-text { text-align: center; color: #666; font-size: 13px; margin-bottom: 20px; }

        /* Caja de Opinión */
        .review-box { background: #1e1e1e; border-radius: 8px; padding: 15px; position: relative; margin-bottom: 10px; }
        .review-label { font-size: 10px; color: #666; font-weight: bold; display: block; margin-bottom: 5px; text-transform: uppercase; }
        .review-text { font-size: 14px; color: #ddd; margin: 0; white-space: pre-wrap; line-height: 1.4; padding-right: 20px; }
        .edit-review-btn { position: absolute; right: 15px; top: 15px; background: none; border: none; color: #666; cursor: pointer; }

        /* Botones Grandes */
        .btn-full { width: 100%; padding: 14px; border-radius: 8px; font-weight: bold; font-size: 14px; border: none; cursor: pointer; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-pages { background: #333; color: white; }
        .btn-row { display: flex; gap: 10px; margin-top: 10px; }
        .btn-outline { background: transparent; border: 1px solid #333; color: white; flex: 1; }
        .btn-danger { background: transparent; border: 1px solid #e50914; color: #e50914; flex: 1; }

        /* MODALES */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-content { background: #1e1e1e; width: 90%; max-width: 400px; padding: 25px; border-radius: 12px; }
        .modal-title { margin: 0 0 20px 0; font-size: 20px; }
        input, textarea { width: 100%; background: #000; border: 1px solid #333; color: white; padding: 12px; border-radius: 6px; margin-bottom: 15px; font-size: 16px; }
        
        /* ZOOM */
        #zoom-view { position: fixed; top:0; left:0; width:100%; height:100%; background: black; z-index: 4000; display: none; justify-content: center; align-items: center; }
        #zoom-img { max-width: 100%; max-height: 100%; object-fit: contain; }
    </style>
</head>
<body onload="initApp()">

    <div id="main-view">
        <div class="top-bar">
            <button class="filter-btn" onclick="openSortModal()"><span class="material-icons-round">sort</span></button>
            <input type="text" id="search-box" class="search-input" placeholder="Buscar..." oninput="renderLibrary()">
        </div>

        <div class="grid" id="books-grid">
            </div>
    </div>

    <nav class="bottom-nav">
        <button class="nav-item active" id="nav-all" onclick="setFilter('all')">
            <span class="material-icons-round">grid_view</span>Libros
        </button>
        <button class="nav-item" id="nav-fav" onclick="setFilter('fav')">
            <span class="material-icons-round">favorite</span>Favs
        </button>
        <button class="nav-item" id="nav-marked" onclick="setFilter('marked')">
            <span class="material-icons-round">bookmark</span>Marc
        </button>
        <button class="nav-item" id="nav-pend" onclick="setFilter('pend')">
            <span class="material-icons-round">schedule</span>Pend
        </button>
        <button class="nav-item" onclick="openSettings()">
            <span class="material-icons-round">settings</span>Ajustes
        </button>
    </nav>

    <div id="detail-view">
        <div class="detail-header">
            <button class="close-btn" onclick="closeDetail()"><span class="material-icons-round">close</span> Cerrar</button>
            <span class="detail-label">DETALLES</span>
        </div>

        <div class="detail-content">
            <div class="detail-cover-area">
                <img id="dt-cover" class="detail-cover" src="">
            </div>
            
            <div class="detail-info">
                <h1 id="dt-title" class="dt-title">Título</h1>
                <p id="dt-author" class="dt-author">AUTOR</p>
            </div>

            <div class="action-row">
                <button id="btn-fav" class="circle-btn" onclick="toggleAction('fav')"><span class="material-icons-round">favorite</span></button>
                <button id="btn-mark" class="circle-btn" onclick="toggleAction('marked')"><span class="material-icons-round">bookmark</span></button>
                <button id="btn-pend" class="circle-btn" onclick="toggleAction('pend')"><span class="material-icons-round">schedule</span></button>
            </div>

            <div id="dt-stars" class="star-row"></div>

            <p id="dt-meta" class="meta-text">Año: 2024 • Leído: -</p>

            <div class="review-box" onclick="openCommentModal()">
                <span class="review-label">TU OPINIÓN</span>
                <p id="dt-comment" class="review-text">Sin comentarios</p>
                <button class="edit-review-btn"><span class="material-icons-round" style="font-size: 16px;">edit</span></button>
            </div>

            <button class="btn-full btn-pages" onclick="openPagesModal()"><span class="material-icons-round">menu_book</span> Ver Páginas Destacadas</button>
            
            <div class="btn-row">
                <button class="btn-full btn-outline" onclick="openEditModal()">Editar</button>
                <button class="btn-full btn-danger" onclick="deleteBook()">Eliminar</button>
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay"><div id="modal-content" class="modal-content"></div></div>
    
    <div id="zoom-view" onclick="this.style.display='none'"><img id="zoom-img"></div>

    <script>
        // --- PEGA TU API KEY AQUÍ ---
        const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUI", 
            authDomain: "bookflix-34356.firebaseapp.com",
            projectId: "bookflix-34356",
            storageBucket: "bookflix-34356.firebasestorage.app", 
            messagingSenderId: "567651297193",
            appId: "1:567651297193:web:48175e8d3697d4d52686b8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();

        let books = [], currentId = null, filter = 'all', sortKey = 'title';

        // --- ARREGLO FOTOS NEGRAS ---
        async function uploadImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); 
                        const MAX = 1200;
                        let w = img.width, h = img.height;
                        if(w > MAX) { h *= MAX/w; w = MAX; }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        
                        // CLAVE: PINTAR FONDO BLANCO PARA EVITAR NEGRO EN PNGs
                        ctx.fillStyle = "#FFFFFF";
                        ctx.fillRect(0, 0, w, h);
                        ctx.drawImage(img, 0, 0, w, h);
                        
                        canvas.toBlob(async (blob) => {
                            const ref = storage.ref().child(`covers/${Date.now()}_${Math.floor(Math.random()*1000)}.jpg`);
                            await ref.put(blob);
                            resolve(await ref.getDownloadURL());
                        }, 'image/jpeg', 0.9);
                    };
                };
            });
        }

        async function initApp() {
            const d = await db.collection('data').doc('lib_prod').get();
            if(d.exists) books = d.data().books || [];
            renderLibrary();
        }

        async function save() { await db.collection('data').doc('lib_prod').set({ books }); }

        function renderLibrary() {
            const grid = document.getElementById('books-grid'); grid.innerHTML = '';
            const term = document.getElementById('search-box').value.toLowerCase();
            
            let list = books.filter(b => {
                if(filter === 'fav') return b.fav;
                if(filter === 'marked') return b.marked;
                if(filter === 'pend') return b.pend;
                return true;
            });

            if(term) list = list.filter(b => b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term));

            // Ordenar
            list.sort((a,b) => {
                let vA = (a[sortKey]||"").toString().toLowerCase();
                let vB = (b[sortKey]||"").toString().toLowerCase();
                if(sortKey==='year' || sortKey==='rating') return vB.localeCompare(vA, undefined, {numeric:true});
                return vA.localeCompare(vB);
            });

            // Tarjeta AÑADIR
            if(filter === 'all' && !term) {
                grid.innerHTML += `<div class="add-card" onclick="openBookModal()"><span class="material-icons-round add-icon">add</span><span>Añadir</span></div>`;
            }

            list.forEach(b => {
                const cover = b.cover || ''; 
                const imgTag = cover.length > 5 ? `<img src="${cover}" class="cover-img">` : `<div class="cover-img" style="display:flex;align-items:center;justify-content:center;color:#333;font-size:40px">📖</div>`;
                
                grid.innerHTML += `
                    <div class="book-card" onclick="openDetail(${b.id})">
                        ${imgTag}
                        <div>
                            <p class="book-title">${b.title}</p>
                            <p class="book-author">${b.author}</p>
                        </div>
                    </div>
                `;
            });
        }

        function openDetail(id) {
            currentId = id; 
            const b = books.find(x => x.id === id);
            const view = document.getElementById('detail-view');
            
            document.getElementById('dt-cover').src = b.cover || '';
            document.getElementById('dt-title').innerText = b.title;
            document.getElementById('dt-author').innerText = b.author;
            document.getElementById('dt-meta').innerText = `Año: ${b.year || '-'} • Leído: ${b.readDate || '-'}`;
            document.getElementById('dt-comment').innerText = b.comment || "Sin comentarios";

            // Botones estado
            document.getElementById('btn-fav').className = `circle-btn ${b.fav ? 'active' : ''}`;
            document.getElementById('btn-mark').className = `circle-btn ${b.marked ? 'active-bookmark' : ''}`;
            document.getElementById('btn-pend').className = `circle-btn ${b.pend ? 'active-clock' : ''}`;

            renderDetailStars(b.rating || 0);
            view.style.display = 'flex';
        }

        function renderDetailStars(rating) {
            const c = document.getElementById('dt-stars'); c.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const icon = rating >= i ? 'star' : (rating >= i-0.5 ? 'star_half' : 'star_border');
                const color = rating >= i-0.5 ? '#ffd700' : '#333';
                c.innerHTML += `<span class="material-icons-round" style="color:${color}; cursor:pointer" onclick="setRating(${i}, event)">${icon}</span>`;
            }
        }

        async function setRating(star, e) {
            const rect = e.target.getBoundingClientRect();
            const val = (e.clientX - rect.left < rect.width/2) ? star - 0.5 : star;
            books.find(b=>b.id===currentId).rating = val;
            await save(); openDetail(currentId);
        }

        async function toggleAction(field) {
            const b = books.find(x=>x.id===currentId);
            b[field] = !b[field];
            await save(); openDetail(currentId);
        }

        // --- MODALES Y LÓGICA ---
        function showModal(html) {
            const overlay = document.getElementById('modal-overlay');
            document.getElementById('modal-content').innerHTML = html;
            overlay.style.display = 'flex';
        }
        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        function closeDetail() { document.getElementById('detail-view').style.display = 'none'; renderLibrary(); }

        function openBookModal() {
            showModal(`
                <h2 class="modal-title">Nuevo Libro</h2>
                <input id="in-title" placeholder="Título">
                <input id="in-author" placeholder="Autor">
                <div style="display:flex; gap:10px">
                    <input id="in-year" type="number" placeholder="Año">
                    <input id="in-date" type="text" placeholder="Leído (ej: Invierno 2025)">
                </div>
                <p style="margin-bottom:5px; color:#888">Portada:</p>
                <input id="in-file" type="file">
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button class="btn-full btn-outline" onclick="closeModal()">Cancelar</button>
                    <button class="btn-full btn-pages" id="btn-save" onclick="saveNewBook()">Guardar</button>
                </div>
            `);
        }

        async function saveNewBook() {
            const t = document.getElementById('in-title').value;
            if(!t) return;
            const btn = document.getElementById('btn-save');
            btn.innerText = "Subiendo..."; btn.disabled = true;

            const f = document.getElementById('in-file').files[0];
            let url = "";
            if(f) url = await uploadImage(f);

            books.push({
                id: Date.now(),
                title: t,
                author: document.getElementById('in-author').value.toUpperCase(),
                year: document.getElementById('in-year').value,
                readDate: document.getElementById('in-date').value,
                cover: url,
                rating: 0, fav: false, marked: false, pend: false, comment: "", pages: []
            });
            await save(); closeModal(); renderLibrary();
        }

        function openEditModal() {
            const b = books.find(x=>x.id===currentId);
            showModal(`
                <h2 class="modal-title">Editar</h2>
                <input id="ed-title" value="${b.title}">
                <input id="ed-author" value="${b.author}">
                <input id="ed-year" value="${b.year}">
                <input id="ed-date" value="${b.readDate}">
                <p style="color:#888">Cambiar portada:</p>
                <input id="ed-file" type="file">
                <div style="display:flex; gap:10px; margin-top:10px">
                    <button class="btn-full btn-outline" onclick="closeModal()">Cancelar</button>
                    <button class="btn-full btn-pages" onclick="saveEdit()">Guardar</button>
                </div>
            `);
        }

        async function saveEdit() {
            const b = books.find(x=>x.id===currentId);
            const f = document.getElementById('ed-file').files[0];
            if(f) b.cover = await uploadImage(f);
            b.title = document.getElementById('ed-title').value;
            b.author = document.getElementById('ed-author').value.toUpperCase();
            b.year = document.getElementById('ed-year').value;
            b.readDate = document.getElementById('ed-date').value;
            await save(); closeModal(); openDetail(currentId);
        }

        function openCommentModal() {
            const b = books.find(x=>x.id===currentId);
            showModal(`
                <h2 class="modal-title">Tu Opinión</h2>
                <textarea id="in-comment" rows="6">${b.comment || ''}</textarea>
                <button class="btn-full btn-pages" onclick="saveComment()">Guardar Opinión</button>
            `);
        }
        async function saveComment() {
            books.find(x=>x.id===currentId).comment = document.getElementById('in-comment').value;
            await save(); closeModal(); openDetail(currentId);
        }

        function openPagesModal() {
            const b = books.find(x=>x.id===currentId);
            let html = (b.pages||[]).map((p,i) => `
                <div style="margin-bottom:15px; border-bottom:1px solid #333; padding-bottom:10px">
                    <img src="${p.img}" style="width:100%; border-radius:4px" onclick="document.getElementById('zoom-img').src='${p.img}';document.getElementById('zoom-view').style.display='flex'">
                    <p style="color:#ccc; margin:5px 0">${p.note}</p>
                    <button onclick="deletePage(${i})" style="color:#e50914; background:none; border:none">Eliminar</button>
                </div>
            `).join('');
            
            showModal(`
                <h2 class="modal-title">Páginas Destacadas</h2>
                <div style="max-height:50vh; overflow-y:auto; margin-bottom:15px">${html}</div>
                <button class="btn-full btn-outline" onclick="addPageForm()">+ Añadir Página</button>
                <button class="btn-full btn-pages" style="margin-top:10px" onclick="closeModal()">Cerrar</button>
            `);
        }

        function addPageForm() {
            showModal(`
                <h2 class="modal-title">Nueva Página</h2>
                <input id="pg-note" placeholder="Nota de la página...">
                <input id="pg-file" type="file">
                <button class="btn-full btn-pages" id="btn-pg-save" onclick="savePage()">Subir</button>
            `);
        }

        async function savePage() {
            const f = document.getElementById('pg-file').files[0];
            if(!f) return;
            document.getElementById('btn-pg-save').innerText = "Subiendo...";
            const url = await uploadImage(f);
            books.find(x=>x.id===currentId).pages.push({ img: url, note: document.getElementById('pg-note').value });
            await save(); openPagesModal();
        }

        async function deletePage(i) {
            books.find(x=>x.id===currentId).pages.splice(i,1);
            await save(); openPagesModal();
        }

        async function deleteBook() {
            if(confirm("¿Seguro que quieres eliminar este libro?")) {
                books = books.filter(x => x.id !== currentId);
                await save(); closeDetail();
            }
        }

        function setFilter(f) {
            filter = f;
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            document.getElementById('nav-'+f).classList.add('active');
            renderLibrary();
        }

        function openSortModal() {
            showModal(`
                <h2 class="modal-title">Ordenar por</h2>
                <button class="btn-full btn-outline" onclick="sortKey='title';renderLibrary();closeModal()">Título (A-Z)</button>
                <button class="btn-full btn-outline" onclick="sortKey='year';renderLibrary();closeModal()">Año (Nuevo-Viejo)</button>
                <button class="btn-full btn-outline" onclick="sortKey='rating';renderLibrary();closeModal()">Mejor Valorados</button>
            `);
        }
        
        function openSettings() { alert("Versión Pro 2026 - Conectado a Bucket de Pago"); }
    </script>
</body>
</html>
