<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookFlix Clase 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-color: #141414;
            --sidebar-bg: #000000;
            --card-bg: #1f1f1f;
            --primary: #e50914; /* Rojo Netflix */
            --text: #ffffff;
            --text-muted: #b3b3b3;
            --nav-width: 250px;
            --radius: 8px;
            --transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* --- PANTALLA DE PERFILES --- */
        #profile-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-color);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease;
        }
        .logo-title {
            color: var(--primary);
            font-size: 4rem;
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(229, 9, 20, 0.5);
        }
        .profiles-grid {
            display: flex; gap: 30px; flex-wrap: wrap; justify-content: center; max-width: 1200px;
        }
        .profile-card {
            display: flex; flex-direction: column; align-items: center; cursor: pointer; group: hover;
            width: 120px;
        }
        .profile-avatar {
            width: 120px; height: 120px;
            background: #333;
            border-radius: 8px;
            overflow: hidden;
            border: 3px solid transparent;
            transition: var(--transition);
            display: flex; justify-content: center; align-items: center; font-size: 40px; color: #555;
        }
        .profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .profile-card:hover .profile-avatar {
            border-color: white;
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.2);
        }
        .profile-name {
            margin-top: 15px;
            color: var(--text-muted);
            font-size: 1.1rem;
            transition: color 0.3s;
        }
        .profile-card:hover .profile-name { color: white; }

        /* --- INTERFAZ PRINCIPAL --- */
        #app-interface { display: none; height: 100vh; grid-template-columns: var(--nav-width) 1fr; }
        
        /* Sidebar */
        .sidebar {
            background: var(--sidebar-bg);
            border-right: 1px solid #333;
            padding: 30px 20px;
            display: flex; flex-direction: column;
            height: 100vh;
            position: sticky; top: 0;
        }
        .user-mini { display: flex; align-items: center; gap: 15px; margin-bottom: 40px; padding-bottom: 20px; border-bottom: 1px solid #333; }
        .user-mini-img { width: 50px; height: 50px; border-radius: 4px; background: #333; object-fit: cover; }
        .nav-item {
            background: none; border: none; width: 100%; text-align: left;
            padding: 12px 15px; color: var(--text-muted); font-size: 1rem;
            cursor: pointer; border-radius: 4px; margin-bottom: 5px;
            transition: 0.2s; display: flex; align-items: center; gap: 12px;
        }
        .nav-item:hover { color: white; background: rgba(255,255,255,0.1); }
        .nav-item.active { color: white; background: rgba(229, 9, 20, 0.15); border-left: 3px solid var(--primary); font-weight: bold; }

        /* Main Content */
        .main-content { padding: 30px 50px; overflow-y: auto; height: 100vh; box-sizing: border-box; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search-box {
            background: #222; border: 1px solid #444; color: white; padding: 12px 20px;
            border-radius: 50px; width: 300px; outline: none; transition: 0.3s;
        }
        .search-box:focus { border-color: white; background: #333; }
        
        /* Grid de Libros */
        .books-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 25px;
            padding-bottom: 100px;
        }
        .book-card {
            background: var(--card-bg); border-radius: var(--radius);
            cursor: pointer; transition: var(--transition);
            position: relative; overflow: hidden;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .book-card:hover {
            transform: scale(1.05);
            z-index: 10;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        .book-cover-wrap {
            aspect-ratio: 2/3; background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .book-cover-wrap img { width: 100%; height: 100%; object-fit: cover; }
        .book-info { padding: 12px; }
        .book-title { font-weight: bold; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .book-meta { font-size: 0.8rem; color: var(--text-muted); margin-top: 4px; }
        .add-book-card {
            border: 2px dashed #444; background: transparent; display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: #666; transition: 0.3s;
            aspect-ratio: 2/3; border-radius: var(--radius);
        }
        .add-book-card:hover { border-color: var(--primary); color: var(--primary); }

        /* --- DETALLE DEL LIBRO (Overlay) --- */
        #detail-view {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 2000;
            display: none; overflow-y: auto; opacity: 0; transition: opacity 0.3s;
        }
        .detail-container {
            max-width: 900px; margin: 40px auto; padding: 20px;
            display: grid; grid-template-columns: 300px 1fr; gap: 40px;
        }
        .detail-cover img { width: 100%; border-radius: 8px; box-shadow: 0 0 30px rgba(255,255,255,0.1); }
        .detail-actions { display: flex; gap: 15px; margin-top: 20px; }
        .action-icon {
            width: 40px; height: 40px; border-radius: 50%; border: 2px solid #666;
            display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s;
        }
        .action-icon svg { width: 20px; height: 20px; fill: white; }
        .action-icon:hover { border-color: white; background: rgba(255,255,255,0.1); }
        .action-icon.active { border-color: var(--primary); background: var(--primary); }
        
        .stars { color: #ffd700; font-size: 1.5rem; cursor: pointer; margin: 10px 0; }
        
        .btn-primary {
            background: white; color: black; border: none; padding: 10px 20px;
            font-weight: bold; border-radius: 4px; cursor: pointer; display: flex; align-items: center; gap: 10px;
            font-size: 1rem; transition: 0.2s;
        }
        .btn-primary:hover { background: #ddd; }
        .btn-secondary {
            background: rgba(109, 109, 110, 0.7); color: white; border: none; padding: 10px 20px;
            font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 1rem; transition: 0.2s;
        }
        .btn-secondary:hover { background: rgba(109, 109, 110, 0.4); }

        /* --- MODALES --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8); z-index: 5000; display: none;
            justify-content: center; align-items: center;
        }
        .modal-box {
            background: #181818; padding: 30px; border-radius: 12px;
            width: 90%; max-width: 500px; position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-box h2 { margin-top: 0; margin-bottom: 20px; border-bottom: 1px solid #333; padding-bottom: 10px;}
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; color: #888; margin-bottom: 5px; font-size: 0.9rem; }
        .input-group input, .input-group textarea {
            width: 100%; background: #333; border: 1px solid #444; color: white;
            padding: 10px; border-radius: 4px; box-sizing: border-box;
        }
        .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        
        /* Spinner de carga */
        .loader { border: 4px solid #333; border-top: 4px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; display: none; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* --- MOVIL --- */
        @media (max-width: 768px) {
            #app-interface { grid-template-columns: 1fr; }
            .sidebar {
                position: fixed; bottom: 0; top: auto; width: 100%; height: 60px;
                flex-direction: row; padding: 0; border-top: 1px solid #333; border-right: none;
                z-index: 1000; background: black; justify-content: space-around;
            }
            .user-mini { display: none; }
            .nav-item { flex-direction: column; gap: 4px; font-size: 0.7rem; justify-content: center; border-left: none !important; border-top: 2px solid transparent; border-radius: 0; }
            .nav-item.active { background: transparent; border-top-color: var(--primary); }
            .main-content { padding: 20px; padding-bottom: 80px; }
            .detail-container { grid-template-columns: 1fr; margin: 10px; }
            .detail-cover { max-width: 200px; margin: 0 auto; }
        }
    </style>
</head>
<body onload="initApp()">

    <div id="profile-screen">
        <div class="logo-title">BOOKFLIX</div>
        <p style="color:#666; margin-top:-40px; margin-bottom:40px;">¿Quién está leyendo?</p>
        <div class="profiles-grid" id="profiles-list">
            </div>
        <div class="loader" id="profile-loader"></div>
    </div>

    <div id="app-interface">
        <aside class="sidebar">
            <div class="user-mini">
                <img id="sb-avatar" class="user-mini-img">
                <span id="sb-name" style="font-weight:bold;">Usuario</span>
            </div>
            
            <button class="nav-item active" onclick="navTo('all')">📚 Biblioteca</button>
            <button class="nav-item" onclick="navTo('fav')">❤️ Favoritos</button>
            <button class="nav-item" onclick="navTo('marked')">🔖 Marcados</button>
            <button class="nav-item" onclick="navTo('pend')">⏳ Pendientes</button>
            
            <div style="flex-grow:1"></div> <button class="nav-item" onclick="openSettings()">⚙️ Ajustes</button>
            <button class="nav-item" onclick="logout()" style="color:#ff4444;">🚪 Salir</button>
        </aside>

        <main class="main-content">
            <div class="header-bar">
                <h2 id="section-title" style="margin:0">Biblioteca</h2>
                <input type="text" class="search-box" placeholder="Buscar título, autor..." oninput="searchBooks(this.value)">
            </div>
            
            <div id="grid-container" class="books-grid">
                </div>
        </main>
    </div>

    <div id="detail-view">
        <div class="detail-container">
            <div class="detail-left">
                <button onclick="closeDetail()" class="btn-secondary" style="margin-bottom:20px;">← Volver</button>
                <div class="detail-cover" id="det-img"></div>
            </div>
            <div class="detail-right">
                <h1 id="det-title" style="margin-bottom:5px; font-size: 2.5rem;">Título</h1>
                <h3 id="det-author" style="color:#999; margin-top:0;">Autor</h3>
                
                <div class="detail-actions">
                    <div class="action-icon" id="btn-fav-icon" onclick="toggleAction('favorite')" title="Favorito">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </div>
                    <div class="action-icon" id="btn-mark-icon" onclick="toggleAction('marked')" title="Marcar página">
                        <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                    </div>
                    <div class="action-icon" id="btn-pend-icon" onclick="toggleAction('isPend')" title="Pendiente">
                        <svg viewBox="0 0 24 24"><path d="M11.99 2C6.47 2 2 6.48 2 12s4.47 10 9.99 10C17.52 22 22 17.52 22 12S17.52 2 11.99 2zM12 20c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
                    </div>
                </div>

                <div id="rating-area" class="stars"></div>
                
                <p id="det-meta" style="color:#666; font-size:0.9rem; margin-top:10px;"></p>
                
                <div style="background:#222; padding:15px; border-radius:8px; margin-top:20px; position:relative;">
                    <span style="color:#555; font-size:0.8rem; text-transform:uppercase; font-weight:bold;">Tu opinión:</span>
                    <button onclick="editComment()" style="position:absolute; right:10px; top:10px; background:none; border:none; cursor:pointer;">✏️</button>
                    <p id="det-comment" style="white-space: pre-wrap; margin-top:5px; color:#ddd;">...</p>
                </div>

                <div style="margin-top: 30px; display:flex; flex-direction:column; gap:10px;">
                    <button onclick="openPagesModal()" class="btn-primary">📖 Ver páginas destacadas</button>
                    <button onclick="openEditBook()" class="btn-secondary">Editar Datos</button>
                    <button onclick="deleteBook()" class="btn-secondary" style="color:#ff4444; border:1px solid #ff4444; background:transparent;">Eliminar Libro</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-wrapper" class="modal-overlay">
        <div id="modal-content" class="modal-box"></div>
    </div>
    
    <div id="zoom-overlay" class="modal-overlay" onclick="this.style.display='none'">
        <img id="zoom-img-tag" style="max-width:95%; max-height:95%; border-radius:4px;">
    </div>

    <script>
        // --- CONFIGURACIÓN FIREBASE ---
        const firebaseConfig = { apiKey: "AIzaSyAoXp6vTOEhk3UCt-SmjNLmb2SUQaZERXc", authDomain: "bookflix-34356.firebaseapp.com", projectId: "bookflix-34356", storageBucket: "bookflix-34356.firebasestorage.app", messagingSenderId: "567651297193", appId: "1:567651297193:web:48175e8d3697d4d52686b8" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // --- ESTADO GLOBAL ---
        let allBooks = []; // Base de datos completa
        let profiles = []; // Lista de perfiles
        let currentUser = null; // Usuario actual (NOMBRE)
        let currentBookId = null; // ID del libro abierto
        let filterMode = 'all'; // Filtro actual (all, fav, marked, pend)
        
        // --- LISTA DE ALUMNOS (PARA AUTO-GENERAR) ---
        const CLASS_ROSTER = ["ADRIANA", "ANA", "GUILLERMO", "ERIK", "ALEXANDER", "DARIEL", "ELENA", "VALERIA", "LUNA", "BELA", "LUCAS", "LUCÍA", "HÉCTOR", "MARCO", "HUGO", "AINARI", "VICTORIA", "QUIANYU"];

        // --- INICIALIZACIÓN ---
        async function initApp() {
            document.getElementById('profile-loader').style.display = 'block';
            try {
                const doc = await db.collection('data').doc('library_v2').get(); // Usamos v2 para limpiar errores previos
                if (doc.exists) {
                    const data = doc.data();
                    allBooks = data.books || [];
                    profiles = data.profiles || [];
                } else {
                    // SI ES LA PRIMERA VEZ: CREAR PERFILES AUTOMÁTICAMENTE
                    profiles = CLASS_ROSTER.map(name => ({
                        name: name,
                        avatar: `https://ui-avatars.com/api/?name=${name}&background=random&color=fff&size=200`
                    }));
                    await saveToDB();
                }
                renderProfiles();
            } catch (error) {
                console.error("Error cargando:", error);
                alert("Error de conexión. Recarga la página.");
            }
            document.getElementById('profile-loader').style.display = 'none';
        }

        async function saveToDB() {
            // Guardado seguro
            try {
                await db.collection('data').doc('library_v2').set({ books: allBooks, profiles: profiles });
            } catch (e) {
                alert("Error al guardar. Comprueba tu conexión.");
            }
        }

        // --- PERFILES ---
        function renderProfiles() {
            const list = document.getElementById('profiles-list');
            list.innerHTML = '';
            
            // Ordenar alfabéticamente para la clase
            profiles.sort((a,b) => a.name.localeCompare(b.name));

            profiles.forEach(p => {
                const card = document.createElement('div');
                card.className = 'profile-card';
                card.onclick = () => login(p);
                
                // Detectar si es imagen o emoji
                const imgContent = p.avatar.includes('http') || p.avatar.includes('data:image') 
                    ? `<img src="${p.avatar}">` 
                    : p.avatar;

                card.innerHTML = `
                    <div class="profile-avatar">${imgContent}</div>
                    <div class="profile-name">${p.name}</div>
                `;
                list.appendChild(card);
            });
            
            // Botón añadir (solo para profesores o extras)
            const addBtn = document.createElement('div');
            addBtn.className = 'profile-card';
            addBtn.onclick = openAddProfile;
            addBtn.innerHTML = `<div class="profile-avatar" style="border:2px dashed #444; background:transparent; font-size:40px;">+</div><div class="profile-name">Añadir</div>`;
            list.appendChild(addBtn);
        }

        function login(profile) {
            currentUser = profile.name;
            // Ocultar perfiles, mostrar app
            document.getElementById('profile-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('profile-screen').style.display = 'none';
                document.getElementById('app-interface').style.display = 'grid';
                // Configurar sidebar
                document.getElementById('sb-name').innerText = profile.name;
                const imgContent = profile.avatar.includes('http') || profile.avatar.includes('data:image') ? profile.avatar : `https://ui-avatars.com/api/?name=${profile.name}`;
                document.getElementById('sb-avatar').src = imgContent;
                navTo('all');
            }, 500);
        }

        function logout() {
            currentUser = null;
            document.getElementById('app-interface').style.display = 'none';
            document.getElementById('profile-screen').style.display = 'flex';
            setTimeout(() => document.getElementById('profile-screen').style.opacity = '1', 50);
        }

        // --- NAVEGACIÓN Y RENDERIZADO ---
        function navTo(mode) {
            filterMode = mode;
            // Actualizar botones sidebar
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
            // Busca el botón que contenga el onclick correcto (forma sencilla)
            const btns = document.querySelectorAll('.nav-item');
            if(mode === 'all') btns[0].classList.add('active');
            if(mode === 'fav') btns[1].classList.add('active');
            if(mode === 'marked') btns[2].classList.add('active');
            if(mode === 'pend') btns[3].classList.add('active');

            // Título
            const titles = { 'all': 'Biblioteca', 'fav': 'Favoritos', 'marked': 'Marcados', 'pend': 'Pendientes' };
            document.getElementById('section-title').innerText = titles[mode];
            
            closeDetail();
            renderBooks();
        }

        function renderBooks(searchTerm = "") {
            const grid = document.getElementById('grid-container');
            grid.innerHTML = '';

            // FILTRADO ESTRICTO: Solo libros que pertenezcan al currentUser
            let myBooks = allBooks.filter(b => b.userId === currentUser);

            // Filtrado por categoría
            if (filterMode === 'fav') myBooks = myBooks.filter(b => b.favorite);
            if (filterMode === 'marked') myBooks = myBooks.filter(b => b.marked);
            if (filterMode === 'pend') myBooks = myBooks.filter(b => b.isPend);

            // Filtrado por búsqueda
            if (searchTerm) {
                const term = searchTerm.toLowerCase();
                myBooks = myBooks.filter(b => b.title.toLowerCase().includes(term) || b.author.toLowerCase().includes(term));
            }

            // Renderizar tarjetas
            myBooks.forEach(book => {
                const el = document.createElement('div');
                el.className = 'book-card';
                el.onclick = () => openDetail(book.id);
                el.innerHTML = `
                    <div class="book-cover-wrap">
                        <img src="${book.cover}" loading="lazy">
                    </div>
                    <div class="book-info">
                        <div class="book-title">${book.title}</div>
                        <div class="book-meta">${book.author}</div>
                        <div style="font-size:12px; margin-top:5px; color:#e50914">${'★'.repeat(Math.round(book.rating))}</div>
                    </div>
                `;
                grid.appendChild(el);
            });

            // Botón "Añadir Libro" (solo en vista 'all' y sin búsqueda)
            if (filterMode === 'all' && !searchTerm) {
                const addDiv = document.createElement('div');
                addDiv.className = 'add-book-card';
                addDiv.onclick = openAddBookModal;
                addDiv.innerHTML = `<span style="font-size:40px; margin-bottom:10px;">+</span><span>Nuevo Libro</span>`;
                grid.appendChild(addDiv);
            }
        }

        function searchBooks(val) {
            renderBooks(val);
        }

        // --- DETALLE DEL LIBRO ---
        function openDetail(id) {
            currentBookId = id;
            const b = allBooks.find(x => x.id === id);
            
            document.getElementById('detail-view').style.display = 'block';
            setTimeout(() => document.getElementById('detail-view').style.opacity = '1', 10);

            // Rellenar datos
            document.getElementById('det-img').innerHTML = `<img src="${b.cover}">`;
            document.getElementById('det-title').innerText = b.title;
            document.getElementById('det-author').innerText = b.author;
            document.getElementById('det-meta').innerText = `${b.year || 'Sin año'} | Leído: ${b.readDate || 'N/D'}`;
            document.getElementById('det-comment').innerText = b.comment || "Sin comentarios aún.";

            // Estados botones
            setBtnState('btn-fav-icon', b.favorite);
            setBtnState('btn-mark-icon', b.marked);
            setBtnState('btn-pend-icon', b.isPend);

            renderStarsInDetail(b.rating);
        }

        function closeDetail() {
            document.getElementById('detail-view').style.opacity = '0';
            setTimeout(() => document.getElementById('detail-view').style.display = 'none', 300);
            currentBookId = null;
        }

        function setBtnState(id, isActive) {
            const el = document.getElementById(id);
            if(isActive) el.classList.add('active'); else el.classList.remove('active');
        }

        async function toggleAction(field) {
            if(!currentBookId) return;
            const b = allBooks.find(x => x.id === currentBookId);
            b[field] = !b[field];
            
            // UI instantánea
            if(field === 'favorite') setBtnState('btn-fav-icon', b[field]);
            if(field === 'marked') setBtnState('btn-mark-icon', b[field]);
            if(field === 'isPend') setBtnState('btn-pend-icon', b[field]);
            
            await saveToDB();
            // Actualizar grid de fondo por si acaso
            renderBooks(document.querySelector('.search-box').value); 
        }

        function renderStarsInDetail(rating) {
            const container = document.getElementById('rating-area');
            container.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const s = document.createElement('span');
                s.innerText = i <= rating ? '★' : '☆';
                s.onclick = async () => {
                    allBooks.find(x => x.id === currentBookId).rating = i;
                    renderStarsInDetail(i);
                    await saveToDB();
                    renderBooks();
                };
                container.appendChild(s);
            }
        }

        // --- GESTIÓN DE DATOS (CRUD) ---
        
        // 1. Añadir Libro
        function openAddBookModal() {
            openModal(`
                <h2>Añadir Nuevo Libro</h2>
                <div class="input-group"><label>Título</label><input id="new-t" type="text" placeholder="Ej. El Principito"></div>
                <div class="input-group"><label>Autor</label><input id="new-a" type="text" placeholder="Ej. Antoine de Saint-Exupéry"></div>
                <div class="input-group"><label>Portada (Foto)</label><input id="new-f" type="file" accept="image/*"></div>
                <div style="display:flex; gap:10px">
                    <div class="input-group" style="flex:1"><label>Año</label><input id="new-y" type="number"></div>
                    <div class="input-group" style="flex:1"><label>Fecha Lectura</label><input id="new-d" type="date"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn-primary" onclick="saveNewBook()">Guardar</button>
                </div>
            `);
        }

        async function saveNewBook() {
            const t = document.getElementById('new-t').value;
            const a = document.getElementById('new-a').value;
            if(!t || !a) return alert("Título y Autor obligatorios");
            
            const file = document.getElementById('new-f').files[0];
            let coverData = "https://via.placeholder.com/300x450?text=Sin+Portada";
            
            if(file) {
                // Comprimir imagen
                coverData = await processImage(file);
            }

            const newBook = {
                id: Date.now().toString(),
                userId: currentUser, // ASOCIACIÓN CRÍTICA
                title: t,
                author: a.toUpperCase(),
                year: document.getElementById('new-y').value,
                readDate: document.getElementById('new-d').value,
                cover: coverData,
                favorite: false, marked: false, isPend: false, rating: 0,
                comment: "",
                pages: []
            };

            allBooks.push(newBook);
            await saveToDB();
            closeModal();
            renderBooks();
        }

        // 2. Editar Libro
        function openEditBook() {
            const b = allBooks.find(x => x.id === currentBookId);
            openModal(`
                <h2>Editar Datos</h2>
                <div class="input-group"><label>Título</label><input id="ed-t" value="${b.title}"></div>
                <div class="input-group"><label>Autor</label><input id="ed-a" value="${b.author}"></div>
                <div class="input-group"><label>Cambiar Portada</label><input id="ed-f" type="file"></div>
                <div style="display:flex; gap:10px">
                    <div class="input-group"><label>Año</label><input id="ed-y" value="${b.year}"></div>
                    <div class="input-group"><label>Fecha</label><input id="ed-d" type="date" value="${b.readDate}"></div>
                </div>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn-primary" onclick="saveEditBook()">Actualizar</button>
                </div>
            `);
        }

        async function saveEditBook() {
            const b = allBooks.find(x => x.id === currentBookId);
            b.title = document.getElementById('ed-t').value;
            b.author = document.getElementById('ed-a').value.toUpperCase();
            b.year = document.getElementById('ed-y').value;
            b.readDate = document.getElementById('ed-d').value;
            
            const file = document.getElementById('ed-f').files[0];
            if(file) b.cover = await processImage(file);

            await saveToDB();
            closeModal();
            // Refrescar vista detalle
            openDetail(currentBookId);
            renderBooks(document.querySelector('.search-box').value);
        }

        // 3. Borrar Libro
        async function deleteBook() {
            if(confirm("¿Seguro que quieres borrar este libro? No se puede recuperar.")) {
                allBooks = allBooks.filter(b => b.id !== currentBookId);
                await saveToDB();
                closeDetail();
                renderBooks();
            }
        }

        // 4. Comentarios
        function editComment() {
            const b = allBooks.find(x => x.id === currentBookId);
            openModal(`
                <h2>Editar Opinión</h2>
                <textarea id="c-text" rows="8" style="width:100%">${b.comment || ''}</textarea>
                <div class="modal-footer">
                    <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button class="btn-primary" onclick="saveComment()">Guardar</button>
                </div>
            `);
        }
        async function saveComment() {
            allBooks.find(x => x.id === currentBookId).comment = document.getElementById('c-text').value;
            await saveToDB();
            closeModal();
            openDetail(currentBookId);
        }

        // --- PÁGINAS DESTACADAS (FOTOS) ---
        function openPagesModal() {
            const b = allBooks.find(x => x.id === currentBookId);
            const listHtml = (b.pages || []).map((p, idx) => `
                <div style="display:flex; gap:15px; margin-bottom:15px; background:#222; padding:10px; border-radius:4px;">
                    <img src="${p.img}" style="width:60px; height:60px; object-fit:cover; cursor:zoom-in" onclick="zoomImage('${p.img}')">
                    <div style="flex:1">
                        <strong>Pág. ${p.num}</strong>
                        <p style="margin:5px 0; font-size:0.9rem; color:#ccc">${p.note}</p>
                    </div>
                    <button onclick="deletePage(${idx})" style="background:none; border:none; color:#ff4444; cursor:pointer;">🗑️</button>
                </div>
            `).join('');

            openModal(`
                <h2>Páginas Destacadas</h2>
                <div style="max-height:300px; overflow-y:auto; margin-bottom:20px;">${listHtml || '<p style="color:#666; text-align:center">No hay páginas guardadas</p>'}</div>
                <div style="border-top:1px solid #444; padding-top:15px;">
                    <h3 style="margin-top:0">Añadir Nueva</h3>
                    <input id="pg-num" type="number" placeholder="Número de página" style="width:80px; margin-bottom:10px; padding:8px;">
                    <input id="pg-note" type="text" placeholder="Nota breve (opcional)" style="width:100%; margin-bottom:10px; padding:8px; box-sizing:border-box;">
                    <input id="pg-file" type="file" accept="image/*" style="margin-bottom:10px;">
                    <button class="btn-primary" style="width:100%; justify-content:center;" onclick="addPage()">+ Añadir Página</button>
                </div>
            `);
        }

        async function addPage() {
            const num = document.getElementById('pg-num').value;
            const note = document.getElementById('pg-note').value;
            const file = document.getElementById('pg-file').files[0];
            
            if(!file) return alert("Debes subir una foto de la página");

            const img = await processImage(file);
            const b = allBooks.find(x => x.id === currentBookId);
            if(!b.pages) b.pages = [];
            
            b.pages.push({ num, note, img });
            await saveToDB();
            openPagesModal(); // Recargar modal
        }

        async function deletePage(idx) {
            if(confirm("¿Borrar esta página?")) {
                allBooks.find(x => x.id === currentBookId).pages.splice(idx, 1);
                await saveToDB();
                openPagesModal();
            }
        }

        function zoomImage(src) {
            document.getElementById('zoom-img-tag').src = src;
            document.getElementById('zoom-overlay').style.display = 'flex';
        }

        // --- UTILIDADES ---
        
        // Modal genérico
        function openModal(html) {
            document.getElementById('modal-content').innerHTML = html;
            document.getElementById('modal-wrapper').style.display = 'flex';
        }
        function closeModal() {
            document.getElementById('modal-wrapper').style.display = 'none';
        }

        // Añadir perfil manual
        function openAddProfile() {
            openModal(`
                <h2>Nuevo Perfil</h2>
                <div class="input-group"><label>Nombre</label><input id="np-name" type="text"></div>
                <div class="modal-footer"><button class="btn-primary" onclick="createProfile()">Crear</button></div>
            `);
        }
        async function createProfile() {
            const n = document.getElementById('np-name').value.toUpperCase();
            if(!n) return;
            profiles.push({ name: n, avatar: `https://ui-avatars.com/api/?name=${n}&background=random` });
            await saveToDB();
            closeModal();
            renderProfiles();
        }

        // Procesador de imágenes (Redimensionar a max 800px para no saturar Firebase)
        function processImage(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const ctx = canvas.getContext('2d');
                        const MAX_W = 800;
                        const scale = MAX_W / img.width;
                        const w = (img.width > MAX_W) ? MAX_W : img.width;
                        const h = (img.width > MAX_W) ? img.height * scale : img.height;
                        
                        canvas.width = w; canvas.height = h;
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.7)); // Calidad 70%
                    };
                };
            });
        }
    </script>
</body>
</html>
