<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookFlix v4 Ultimate</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --bg: #050505;
            --panel: #141414;
            --primary: #E50914; 
            --text: #ffffff;
            --gray: #b3b3b3;
            --border: #333;
        }

        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }

        /* PERFILES */
        #profile-screen { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .p-card { text-align: center; cursor: pointer; transition: 0.2s; margin: 20px; }
        .p-card:hover { transform: scale(1.05); }
        .p-avatar { width: 120px; height: 120px; border-radius: 10px; overflow: hidden; border: 3px solid transparent; margin-bottom: 10px; }
        .p-card:hover .p-avatar { border-color: white; }

        /* APP LAYOUT */
        #app-ui { display: none; height: 100vh; grid-template-columns: 250px 1fr; }
        .sidebar { background: black; border-right: 1px solid var(--border); padding: 30px 20px; display: flex; flex-direction: column; }
        .menu-btn { background: transparent; border: none; color: var(--gray); width: 100%; text-align: left; padding: 12px; cursor: pointer; display: flex; align-items: center; gap: 12px; font-size: 1rem; border-radius: 6px; margin-bottom: 5px; }
        .menu-btn:hover { color: white; background: #222; }
        .menu-btn.active { color: white; background: #222; font-weight: bold; border-left: 3px solid var(--primary); }

        .main { padding: 30px 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .search { background: #1a1a1a; border: 1px solid var(--border); color: white; padding: 10px 15px; border-radius: 4px; width: 300px; }

        /* GRID */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 25px; padding-bottom: 50px; }
        .book { cursor: pointer; transition: 0.3s; }
        .book:hover { transform: scale(1.05); z-index: 10; }
        .cover { aspect-ratio: 2/3; background: #222; border-radius: 6px; overflow: hidden; margin-bottom: 8px; position: relative; }
        .cover img { width: 100%; height: 100%; object-fit: cover; }
        
        /* TARJETA AÑADIR (REQ 1) */
        .add-card { border: 2px dashed #444; display: flex; flex-direction: column; justify-content: center; align-items: center; color: #666; aspect-ratio: 2/3; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        .add-card:hover { border-color: var(--primary); color: var(--primary); background: rgba(229, 9, 20, 0.1); }

        /* DETALLE OVERLAY */
        #detail-view { position: fixed; inset: 0; background: #141414; z-index: 2000; display: none; overflow-y: auto; }
        .d-cols { display: grid; grid-template-columns: 320px 1fr; gap: 40px; max-width: 1100px; margin: 40px auto; padding: 20px; }
        .btn-icon { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #555; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .btn-icon.active { border-color: var(--primary); background: var(--primary); color: white; }

        /* ESTRELLAS (REQ 4) */
        .star-box { display: inline-flex; font-size: 2.2rem; cursor: pointer; color: #444; position: relative; }
        .star { position: relative; display: inline-block; width: 1em; overflow: hidden; }
        .star-fill { color: #ffd700; position: absolute; top: 0; left: 0; width: 0; overflow: hidden; pointer-events: none; }
        .star.full .star-fill { width: 100%; }
        .star.half .star-fill { width: 50%; }

        /* MODALES */
        .modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 5000; display: none; justify-content: center; align-items: center; }
        .modal { background: #1f1f1f; padding: 30px; border-radius: 12px; width: 90%; max-width: 500px; border: 1px solid #333; max-height: 90vh; overflow-y: auto; }
        .input { width: 100%; padding: 12px; background: #2b2b2b; border: 1px solid #333; color: white; margin-bottom: 15px; border-radius: 6px; box-sizing: border-box; }
        
        /* MODAL DE PÁGINAS (REQ 7 - ESTÉTICA) */
        .pages-feed { max-height: 60vh; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; margin-bottom: 20px; }
        .page-item { background: #000; border-radius: 8px; overflow: hidden; border: 1px solid #333; }
        .page-img { width: 100%; display: block; cursor: zoom-in; }
        .page-info { padding: 15px; display: flex; justify-content: space-between; align-items: start; }

        /* ZOOM & NAV (REQ 8) */
        .zoom-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; padding: 20px; font-size: 30px; cursor: pointer; border-radius: 50%; width: 70px; height: 70px; display: flex; justify-content: center; align-items: center; z-index: 6000; transition: 0.2s; }
        .zoom-nav:hover { background: var(--primary); }

        .btn { padding: 12px; border-radius: 6px; font-weight: bold; border: none; cursor: pointer; width: 100%; margin-bottom: 10px; }
        .btn-pri { background: var(--primary); color: white; }
        .btn-sec { background: #333; color: white; }

        @media (max-width: 768px) {
            #app-ui { grid-template-columns: 1fr; }
            .sidebar { display: none; }
            .d-cols { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body onload="init()">

    <div id="profile-screen">
        <h1 style="color:var(--primary); font-size:3rem; margin-bottom:40px; letter-spacing:-1px;">BOOKFLIX</h1>
        <div id="profiles-box" style="display:flex; gap:30px;"></div>
    </div>

    <div id="app-ui">
        <aside class="sidebar">
            <div style="display:flex; align-items:center; gap:10px; margin-bottom:40px; padding-bottom:20px; border-bottom:1px solid #333;">
                <img id="sb-img" style="width:40px; height:40px; border-radius:5px; object-fit:cover;">
                <div id="sb-name" style="font-weight:bold;"></div>
            </div>
            <button class="menu-btn active" onclick="nav('all', this)"><span class="material-icons-round">grid_view</span> Biblioteca</button>
            <button class="menu-btn" onclick="nav('fav', this)"><span class="material-icons-round">favorite</span> Favoritos</button>
            <button class="menu-btn" onclick="nav('marked', this)"><span class="material-icons-round">bookmark</span> Marcados</button>
            <button class="menu-btn" onclick="nav('pend', this)"><span class="material-icons-round">schedule</span> Pendientes</button>
            <div style="margin-top:auto">
                <button class="menu-btn" onclick="openSettings()"><span class="material-icons-round">settings</span> Ajustes</button>
                <button class="menu-btn" onclick="location.reload()" style="color:#ff4444"><span class="material-icons-round">logout</span> Salir</button>
            </div>
        </aside>

        <main class="main">
            <div class="header">
                <h2 id="sec-title" style="margin:0">Biblioteca</h2>
                <div style="display:flex; gap:10px;">
                    <input class="search" placeholder="Buscar..." oninput="render(this.value)">
                    <button onclick="openSort()" style="background:#333; border:none; color:white; padding:10px; border-radius:4px; cursor:pointer;"><span class="material-icons-round">sort</span></button>
                </div>
            </div>
            <div id="grid" class="grid"></div>
        </main>
    </div>

    <div id="detail-view">
        <button onclick="document.getElementById('detail-view').style.display='none'" style="position:fixed; top:20px; left:20px; background:rgba(0,0,0,0.6); color:white; border:none; padding:10px 20px; border-radius:5px; cursor:pointer;">← Volver</button>
        <div class="d-cols">
            <div><img id="det-img" style="width:100%; border-radius:8px; box-shadow:0 10px 40px black;"></div>
            <div>
                <h1 id="det-title" style="font-size:2.5rem; margin-bottom:5px; line-height:1.1"></h1>
                <h3 id="det-author" style="color:#999; margin-top:0;"></h3>
                
                <div style="display:flex; gap:15px; margin:20px 0;">
                    <div id="i-fav" class="btn-icon" onclick="toggle('favorite')"><span class="material-icons-round">favorite</span></div>
                    <div id="i-mark" class="btn-icon" onclick="toggle('marked')"><span class="material-icons-round">bookmark</span></div>
                    <div id="i-pend" class="btn-icon" onclick="toggle('isPend')"><span class="material-icons-round">schedule</span></div>
                </div>

                <div id="star-area" class="star-box" onmousemove="hoverStars(event)" onmouseleave="renderStars()"></div>
                <div id="det-meta" style="color:#666; font-size:0.9rem; margin-top:5px; margin-bottom:20px;"></div>

                <div style="background:#222; padding:20px; border-radius:8px; position:relative; margin-bottom:20px; border:1px solid #333;">
                    <div style="font-size:0.8rem; font-weight:bold; color:#555; margin-bottom:5px;">TU OPINIÓN</div>
                    <button onclick="openCommentModal()" style="position:absolute; top:15px; right:15px; background:none; border:none; color:#888; cursor:pointer;"><span class="material-icons-round">edit</span></button>
                    <p id="det-comm" style="white-space: pre-wrap; color:#ddd; margin:0; min-height:20px;">...</p>
                </div>

                <button class="btn btn-sec" onclick="openPagesView()">📖 Ver páginas destacadas</button>
                <div style="display:flex; gap:10px;">
                    <button class="btn btn-sec" onclick="openEdit()">Editar Datos</button>
                    <button class="btn btn-sec" onclick="delBook()" style="color:#ff4444; border:1px solid #ff4444; background:transparent;">Eliminar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-bg" class="modal-bg"><div id="modal-c" class="modal"></div></div>

    <div id="zoom-overlay" class="modal-bg" onclick="this.style.display='none'">
        <button class="zoom-nav" style="left:20px;" onclick="navImg(-1, event)">❮</button>
        <img id="zoom-img" style="max-height:95vh; max-width:85vw; border-radius:4px; box-shadow: 0 0 50px black;">
        <button class="zoom-nav" style="right:20px;" onclick="navImg(1, event)">❯</button>
    </div>

    <script>
        const db = firebase.initializeApp({ apiKey: "AIzaSyAoXp6vTOEhk3UCt-SmjNLmb2SUQaZERXc", authDomain: "bookflix-34356.firebaseapp.com", projectId: "bookflix-34356", storageBucket: "bookflix-34356.firebasestorage.app", messagingSenderId: "567651297193", appId: "1:567651297193:web:48175e8d3697d4d52686b8" }).firestore();
        
        let books = [], profiles = [], user = null, curId = null, filter = 'all', zoomIdx = 0;

        async function init() {
            try {
                const d = (await db.collection('data').doc('lib_v4').get()).data();
                books = d?.books || []; profiles = d?.profiles || [];
                if(!profiles.length) { profiles = [{name:"JORGE", avatar:"https://ui-avatars.com/api/?name=Jorge&background=random"}, {name:"ALEJANDRA", avatar:"https://ui-avatars.com/api/?name=Alejandra&background=random"}]; save(); }
                renderProfs();
            } catch(e) { console.log(e); }
        }
        async function save() { await db.collection('data').doc('lib_v4').set({books, profiles}); }

        function renderProfs() {
            const c = document.getElementById('profiles-box'); c.innerHTML = '';
            profiles.forEach(p => {
                const d = document.createElement('div'); d.className = 'p-card'; d.onclick = ()=>login(p);
                d.innerHTML = `<div class="p-avatar"><img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover"></div><b>${p.name}</b>`;
                c.appendChild(d);
            });
        }
        function login(p) { user=p.name; document.getElementById('profile-screen').style.display='none'; document.getElementById('app-ui').style.display='grid'; document.getElementById('sb-name').innerText=p.name; document.getElementById('sb-img').src=p.avatar; render(); }
        function nav(f, b) { filter=f; document.querySelectorAll('.menu-btn').forEach(x=>x.classList.remove('active')); if(b) b.classList.add('active'); render(); }

        function render(q="") {
            const g = document.getElementById('grid'); g.innerHTML = '';
            let l = books.filter(b => b.userId === user);
            if(filter!=='all') l = l.filter(b => b[filter==='fav'?'favorite':(filter==='marked'?'marked':'isPend')]);
            if(q) l = l.filter(b => b.title.toLowerCase().includes(q.toLowerCase()));
            
            l.forEach(b => {
                const d = document.createElement('div'); d.className = 'book'; d.onclick = ()=>openDet(b.id);
                d.innerHTML = `<div class="cover"><img src="${b.cover}"></div><b>${b.title}</b><br><small style="color:#888">${b.author}</small>`;
                g.appendChild(d);
            });

            // REQ 1: Botón añadir dentro del grid
            if(filter==='all' && !q) {
                const add = document.createElement('div'); add.className = 'add-card'; add.onclick = openAdd;
                add.innerHTML = `<span class="material-icons-round" style="font-size:50px">add</span><span>Añadir Libro</span>`;
                g.appendChild(add);
            }
        }

        function openDet(id) {
            curId = id; const b = books.find(x=>x.id===id);
            document.getElementById('detail-view').style.display = 'block';
            document.getElementById('det-img').src = b.cover;
            document.getElementById('det-title').innerText = b.title;
            document.getElementById('det-author').innerText = b.author;
            document.getElementById('det-meta').innerText = `Año: ${b.year||'-'} | Leído: ${b.readDate||'-'}`;
            document.getElementById('det-comm').innerText = b.comment || "Sin comentarios...";
            
            ['favorite','marked','isPend'].forEach(k => document.getElementById(k==='favorite'?'i-fav':(k==='marked'?'i-mark':'i-pend')).classList.toggle('active', b[k]));
            renderStars();
        }

        async function toggle(k) { const b = books.find(x=>x.id===curId); b[k]=!b[k]; await save(); openDet(curId); render(); }

        // REQ 4: Estrellas Medias
        function renderStars() {
            const b = books.find(x=>x.id===curId);
            const r = b ? b.rating : 0;
            const c = document.getElementById('star-area'); c.innerHTML = '';
            for(let i=1; i<=5; i++) {
                const s = document.createElement('span'); s.className = 'star';
                if(r >= i) s.classList.add('full'); else if(r >= i-0.5) s.classList.add('half');
                s.innerHTML = '★<span class="star-fill">★</span>';
                s.onclick = (e) => rate(i, e);
                c.appendChild(s);
            }
        }
        function hoverStars(e) { /* Efecto visual opcional */ }
        async function rate(i, e) {
            const rect = e.target.closest('.star').getBoundingClientRect();
            const isHalf = (e.clientX - rect.left) < (rect.width / 2);
            books.find(x=>x.id===curId).rating = isHalf ? i - 0.5 : i;
            await save(); renderStars(); render();
        }

        // --- MODALES (Con botones cancelar REQ 3, 6) ---
        function modal(h) { document.getElementById('modal-c').innerHTML = h; document.getElementById('modal-bg').style.display = 'flex'; }
        function closeM() { document.getElementById('modal-bg').style.display = 'none'; }

        function openAdd() {
            modal(`<h2>Nuevo Libro</h2>
            <input id="nt" class="input" placeholder="Título"><input id="na" class="input" placeholder="Autor">
            <input id="ny" type="number" class="input" placeholder="Año">
            <label style="font-size:0.8rem; color:#888;">Portada:</label><input id="nf" type="file" class="input">
            <button class="btn btn-pri" onclick="addB()">Guardar</button>
            <button class="btn btn-sec" onclick="closeM()">Cancelar</button>`); // REQ 3
        }
        async function addB() {
            const t=document.getElementById('nt').value; if(!t) return;
            const f=document.getElementById('nf').files[0];
            const c = f ? await procImg(f) : "https://via.placeholder.com/300x450";
            books.push({ id:Date.now().toString(), userId:user, title:t, author:document.getElementById('na').value.toUpperCase(), year:document.getElementById('ny').value, cover:c, favorite:false, marked:false, isPend:false, rating:0, comment:"", pages:[] });
            await save(); closeM(); render();
        }

        function openEdit() {
            const b = books.find(x=>x.id===curId);
            modal(`<h2>Editar</h2>
            <label>Título</label><input id="et" class="input" value="${b.title}">
            <label>Autor</label><input id="ea" class="input" value="${b.author}">
            <label>Año</label><input id="ey" class="input" value="${b.year}">
            <label>Fecha Lectura</label><input id="ed" type="date" class="input" value="${b.readDate}">
            <label>Portada</label><input id="ef" type="file" class="input">
            <button class="btn btn-pri" onclick="saveEd()">Guardar Cambios</button>
            <button class="btn btn-sec" onclick="closeM()">Cancelar</button>`); // REQ 3
        }
        async function saveEd() {
            const b = books.find(x=>x.id===curId);
            b.title = document.getElementById('et').value; b.author = document.getElementById('ea').value; b.year = document.getElementById('ey').value; b.readDate = document.getElementById('ed').value;
            const f = document.getElementById('ef').files[0]; if(f) b.cover = await procImg(f);
            await save(); closeM(); openDet(curId); render();
        }
        async function delBook() { if(confirm("¿Borrar?")) { books=books.filter(x=>x.id!==curId); await save(); document.getElementById('detail-view').style.display='none'; render(); } }

        // REQ 2: Comentario
        function openCommentModal() {
            const b = books.find(x=>x.id===curId);
            modal(`<h2>Tu Opinión</h2>
            <textarea id="nc" class="input" rows="5">${b.comment||''}</textarea>
            <button class="btn btn-pri" onclick="saveComm()">Guardar Comentario</button>
            <button class="btn btn-sec" onclick="closeM()">Cancelar</button>`);
        }
        async function saveComm() { books.find(x=>x.id===curId).comment = document.getElementById('nc').value; await save(); closeM(); openDet(curId); }

        // REQ 5 & 7: Páginas Estéticas y Grandes
        function openPagesView() {
            const b = books.find(x=>x.id===curId);
            const list = (b.pages||[]).map((p,i) => `
                <div class="page-item">
                    <img src="${p.img}" class="page-img" onclick="zoom(${i})">
                    <div class="page-info">
                        <div>
                            <strong style="color:var(--primary); font-size:1.1rem;">Página ${p.num}</strong>
                            <p style="margin:5px 0 0 0; color:#ccc;">${p.note}</p>
                        </div>
                        <button onclick="delP(${i})" style="background:none; border:none; color:#ff4444; cursor:pointer;"><span class="material-icons-round">delete</span></button>
                    </div>
                </div>
            `).join('');

            modal(`
                <h2 style="position:sticky; top:0; background:#1f1f1f; margin:0; padding-bottom:15px; border-bottom:1px solid #333;">Páginas Destacadas</h2>
                <div class="pages-feed">${list || '<p style="text-align:center; color:#666; padding:20px;">No hay páginas guardadas.</p>'}</div>
                
                <div style="background:#2b2b2b; padding:15px; border-radius:8px; border:1px solid #444;">
                    <h3 style="margin:0 0 10px 0; font-size:1rem;">Añadir Nueva</h3>
                    <div style="display:flex; gap:10px;">
                        <input id="pn" type="number" class="input" placeholder="Nº Pág" style="width:80px; margin:0;">
                        <input id="pt" class="input" placeholder="Nota..." style="margin:0;">
                    </div>
                    <input id="pf" type="file" class="input" style="margin-top:10px;">
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button class="btn btn-pri" onclick="addP()">Añadir Foto</button>
                        <button class="btn btn-sec" onclick="closeM()">Cerrar</button>
                    </div>
                </div>
            `);
        }
        async function addP() {
            const f=document.getElementById('pf').files[0];
            if(!f) return alert("Sube una foto");
            const img = await procImg(f);
            books.find(x=>x.id===curId).pages.push({ num:document.getElementById('pn').value, note:document.getElementById('pt').value, img });
            await save(); openPagesView(); // Recarga el modal
        }
        async function delP(i) { if(confirm("¿Borrar página?")) { books.find(x=>x.id===curId).pages.splice(i,1); await save(); openPagesView(); } }

        // REQ 8: Navegación Galería
        function zoom(i) { zoomIdx = i; updZoom(); document.getElementById('zoom-overlay').style.display='flex'; }
        function navImg(d, e) { e.stopPropagation(); const p = books.find(x=>x.id===curId).pages; zoomIdx = (zoomIdx + d + p.length) % p.length; updZoom(); }
        function updZoom() { document.getElementById('zoom-img').src = books.find(x=>x.id===curId).pages[zoomIdx].img; }

        // AJUSTES
        function openSettings() {
            const p = profiles.find(x=>x.name===user);
            modal(`<h2>Ajustes</h2><label>Nombre</label><input id="sn" class="input" value="${p.name}"><label>Foto</label><input id="sf" type="file" class="input">
            <button class="btn btn-sec" onclick="exportD()">💾 Backup</button>
            <button class="btn btn-sec" onclick="document.getElementById('imp').click()">📂 Importar</button><input id="imp" type="file" hidden onchange="importD(this)">
            <hr style="border-color:#333; margin:20px 0;">
            <button class="btn btn-pri" onclick="saveSet()">Guardar</button>
            <button class="btn btn-sec" onclick="closeM()">Cancelar</button>`);
        }
        async function saveSet() {
            const old=user, n=document.getElementById('sn').value.toUpperCase();
            profiles.find(x=>x.name===user).name = n;
            books.forEach(b=>{if(b.userId===old)b.userId=n});
            user=n;
            const f=document.getElementById('sf').files[0]; if(f) profiles.find(x=>x.name===user).avatar = await procImg(f);
            await save(); location.reload();
        }

        // UTILS
        function openSort() { modal(`<h2>Ordenar</h2><button class="btn btn-sec" onclick="sort('title')">A-Z</button><button class="btn btn-sec" onclick="sort('rating')">Estrellas</button><button class="btn btn-sec" onclick="sort('year')">Año</button><button class="btn btn-sec" onclick="closeM()">Cancelar</button>`); }
        function sort(k) { books.sort((a,b)=>k==='title'?a.title.localeCompare(b.title):(b[k]||0)-(a[k]||0)); closeM(); render(); }
        function exportD() { const a=document.createElement('a'); a.href="data:text/json;charset=utf-8,"+encodeURIComponent(JSON.stringify(books.filter(b=>b.userId===user))); a.download="backup.json"; a.click(); }
        function importD(i) { const r=new FileReader(); r.onload=async e=>{ try{const d=JSON.parse(e.target.result); d.forEach(b=>b.userId=user); books=[...books,...d]; await save(); location.reload();}catch(x){alert("Error JSON");} }; r.readAsText(i.files[0]); }
        function procImg(f) { return new Promise(r=>{ const rd=new FileReader(); rd.onload=e=>{ const i=new Image(); i.src=e.target.result; i.onload=()=>{ const c=document.createElement('canvas'); const s=800/i.width; c.width=Math.min(i.width,800); c.height=i.height*(c.width/i.width); c.getContext('2d').drawImage(i,0,0,c.width,c.height); r(c.toDataURL('image/jpeg',0.7)); }}; rd.readAsDataURL(f); }); }
    </script>
</body>
