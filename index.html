<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookFlix Pro 2026</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { 
            --bg-color: #141414; --sidebar-color: #000; --accent: #e50914; 
            --text: white; --gray: #b3b3b3; --sidebar-width: 260px; 
        }

        body { 
            background: var(--bg-color); color: var(--text); 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            margin: 0; padding: 0; overflow-x: hidden; min-height: 100vh;
        }

        /* PERFILES */
        #profile-selection { 
            display: flex !important; flex-direction: column; justify-content: center; align-items: center; 
            height: 100vh; background: var(--bg-color); position: fixed; width: 100%; top: 0; left: 0; z-index: 10000; 
        }
        .profiles-gate { display: flex; gap: 25px; flex-wrap: wrap; justify-content: center; }
        .profile-card { cursor: pointer; text-align: center; width: 130px; }
        .avatar { 
            width: 130px; height: 130px; background: #333; border-radius: 4px; 
            display: flex; justify-content: center; align-items: center; font-size: 60px; 
            overflow: hidden; border: 3px solid transparent; transition: 0.3s; 
        }
        .profile-card:hover .avatar { border: 3px solid white; transform: scale(1.05); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* INTERFAZ PRINCIPAL */
        #main-interface { display: none; min-height: 100vh; grid-template-columns: var(--sidebar-width) 1fr; }
        
        .sidebar { 
            background: var(--sidebar-color); padding: 40px 20px; border-right: 1px solid #222; 
            display: flex; flex-direction: column; height: 100vh; position: sticky; top: 0;
        }
        .sidebar-user { margin-bottom: 40px; text-align: center; }
        .sidebar-avatar { 
            width: 90px; height: 90px; background: #333; border-radius: 4px; 
            margin: 0 auto 15px; overflow: hidden; display: flex; justify-content: center; align-items: center;
        }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .nav-btn { 
            background: transparent; border: none; color: var(--gray); text-align: left; 
            padding: 12px 15px; font-size: 1rem; cursor: pointer; width: 100%; 
            display: flex; align-items: center; gap: 15px; transition: 0.2s; border-radius: 4px;
        }
        .nav-btn.active { color: white; background: rgba(229, 9, 20, 0.2); border-left: 4px solid var(--accent); }

        #content-area { padding: 40px 60px; min-height: 100vh; overflow-y: visible; }

        /* GRID */
        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 25px; }
        .book-card { background: #1a1a1a; border-radius: 4px; cursor: pointer; border: 1px solid #222; overflow: hidden; transition: 0.3s; }
        .book-card:hover { transform: translateY(-5px); border-color: #555; }
        .book-cover { height: 260px; background: #000; display: flex; justify-content: center; align-items: center; }
        .book-cover img { width: 100%; height: 100%; object-fit: contain; }

        /* ZOOM OVERLAY */
        #zoom-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); z-index: 30000; 
            display: none; justify-content: center; align-items: center; 
        }
        #zoom-img { max-width: 90%; max-height: 90%; object-fit: contain; }
        .zoom-nav { 
            position: absolute; top: 50%; transform: translateY(-50%); 
            background: rgba(255,255,255,0.1); color: white; border: none; 
            padding: 20px; font-size: 2.5rem; cursor: pointer; border-radius: 50%; 
        }

        /* MÓVIL */
        @media (max-width: 768px) {
            #main-interface { grid-template-columns: 1fr; }
            .sidebar { display: none !important; }
            .sidebar.mobile-active { 
                display: flex !important; position: fixed !important; bottom: 0; left: 0; 
                width: 100% !important; height: 70px !important; flex-direction: row !important; 
                background: #000; border-top: 1px solid #333; z-index: 9999; justify-content: space-around; padding: 0 !important;
            }
            #content-area { padding: 20px 15px 120px 15px !important; }
            .books-grid { grid-template-columns: repeat(2, 1fr) !important; gap: 12px; }
            #book-detail-view { position: fixed !important; top:0; left:0; width:100%; height:100%; z-index: 15000; background: #141414; overflow-y: auto; padding-bottom: 120px; }
            .detail-layout { display: block !important; }
            .detail-left { width: 100% !important; height: 45vh !important; }
            .detail-right { width: 100% !important; padding: 20px !important; box-sizing: border-box; }
            .btn-action { width: 100% !important; padding: 16px !important; margin-bottom: 10px; }
        }

        .modal-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:20000; }
        .modal-content { background:#222; padding:30px; border-radius:8px; width:90%; max-width:450px; text-align:center; }
        .modal-content input, .modal-content textarea { width:100%; padding:12px; margin:10px 0; background:#333; border:1px solid #444; color:white; border-radius:4px; box-sizing:border-box; }
    </style>
</head>
<body onload="initApp()">

    <div id="profile-selection">
        <h1 style="color: #accent; color:#e50914; font-size: 3.5rem; font-weight: 900; margin-bottom: 40px;">BOOKFLIX</h1>
        <div class="profiles-gate" id="profiles-container"></div>
    </div>

    <div id="main-interface">
        <aside class="sidebar">
            <div class="sidebar-user">
                <div id="current-avatar" class="sidebar-avatar"></div>
                <div id="current-username" style="font-weight: bold;"></div>
            </div>
            <nav>
                <button class="nav-btn active" id="btn-all" onclick="showCategory('all')">📚 Biblioteca</button>
                <button class="nav-btn" id="btn-fav" onclick="showCategory('fav')">❤️ Favoritos</button>
                <button class="nav-btn" id="btn-marked" onclick="showCategory('marked')">🔖 Marcados</button>
                <button class="nav-btn" id="btn-pend" onclick="showCategory('pend')">⏳ Pendientes</button>
                <button class="nav-btn" onclick="logout()" style="color:#ff4444; margin-top:20px;">🚪 Salir</button>
            </nav>
        </aside>

        <main id="content-area">
            <div style="display:flex; justify-content:space-between; margin-bottom:30px;">
                <input type="text" id="main-search" style="background:#222; border:1px solid #444; color:white; padding:10px 20px; border-radius:4px; width:300px;" placeholder="Buscar título, autor o año..." oninput="renderBooks()">
                <button onclick="openSortModal()" style="background:#333; color:white; border:none; padding:10px 20px; cursor:pointer;">⇅ Ordenar</button>
            </div>
            
            <div id="books-grid-container"><div class="books-grid" id="books-grid"></div></div>
            
            <div id="book-detail-view" style="display:none;">
                <button onclick="closeBookDetail()" style="background:#333; color:white; border:none; padding:10px 20px; cursor:pointer; margin-bottom:20px;">← Volver</button>
                <div class="detail-layout">
                    <div id="det-img-container" class="detail-left"></div>
                    <div class="detail-right">
                        <h1 id="det-title" style="margin:0; font-size:2.5rem;"></h1>
                        <h2 id="det-author" style="color:var(--gray); margin:0;"></h2>
                        <p id="det-meta" style="color:#888;"></p>
                        <div style="background:#222; padding:15px; border-radius:8px; position:relative;">
                            <button onclick="openEditCommentModal()" style="position:absolute; right:10px; top:10px; background:none; border:none; color:white; cursor:pointer;">✏️</button>
                            <p id="comment-text" style="margin:0;"></p>
                        </div>
                        <button onclick="openAllPagesView()" style="background:white; color:black; padding:15px; font-weight:bold; border:none; border-radius:4px; cursor:pointer; margin-top:10px;">Páginas Destacadas 📖</button>
                        <div style="margin-top:20px; display:flex; gap:10px;">
                            <button onclick="openEditBookModal()" style="background:#444; color:white; border:none; padding:12px; flex:1; cursor:pointer;">Editar Datos</button>
                            <button onclick="deleteBook()" style="background:none; border:1px solid #ff4444; color:#ff4444; flex:1; cursor:pointer;">Borrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="zoom-overlay" onclick="this.style.display='none'">
        <button class="zoom-nav" style="left:20px;" onclick="changeZoomIdx(-1, event)">❮</button>
        <img id="zoom-img">
        <button class="zoom-nav" style="right:20px;" onclick="changeZoomIdx(1, event)">❯</button>
    </div>

    <div id="modal-overlay" class="modal-overlay"><div id="modal-dynamic-content"></div></div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyAoXp6vTOEhk3UCt-SmjNLmb2SUQaZERXc", authDomain: "bookflix-34356.firebaseapp.com", projectId: "bookflix-34356", storageBucket: "bookflix-34356.firebasestorage.app", messagingSenderId: "567651297193", appId: "1:567651297193:web:48175e8d3697d4d52686b8" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allBooks = [], profiles = [], currentUser = "", currentBookId = null, currentZoomIdx = 0, currentCat = 'all';

        async function initApp() {
            const doc = await db.collection('data').doc('library').get();
            if(doc.exists) {
                const d = doc.data();
                profiles = d.profiles || [];
                allBooks = d.books || [];
            }
            renderProfiles();
        }

        async function sync() { await db.collection('data').doc('library').set({ books: allBooks, profiles }); }

        function renderProfiles() {
            const c = document.getElementById('profiles-container'); c.innerHTML = '';
            profiles.forEach(p => {
                const div = document.createElement('div'); div.className = 'profile-card';
                div.onclick = () => accessProfile(p.name, p.avatar);
                div.innerHTML = `<div class="avatar">${p.avatar.startsWith('data') ? `<img src="${p.avatar}">` : p.avatar}</div><span style="display:block;margin-top:10px;font-weight:bold">${p.name}</span>`;
                c.appendChild(div);
            });
            const add = document.createElement('div'); add.className = 'profile-card';
            add.onclick = () => openProfileModal();
            add.innerHTML = `<div class="avatar" style="font-size:40px">+</div><span style="display:block;margin-top:10px">Añadir</span>`;
            c.appendChild(add);
        }

        function accessProfile(name, avatar) {
            currentUser = name;
            document.getElementById('profile-selection').style.setProperty('display', 'none', 'important');
            document.getElementById('main-interface').style.display = 'grid';
            document.querySelector('.sidebar').classList.add('mobile-active');
            document.getElementById('current-username').innerText = name;
            document.getElementById('current-avatar').innerHTML = avatar.startsWith('data') ? `<img src="${avatar}">` : avatar;
            showCategory('all');
        }

        function renderBooks() {
            const grid = document.getElementById('books-grid'); grid.innerHTML = '';
            const query = document.getElementById('main-search').value.toLowerCase();
            let filtered = allBooks.filter(b => b.userId === currentUser);
            if(query) filtered = filtered.filter(b => b.title.toLowerCase().includes(query) || b.author.toLowerCase().includes(query) || (b.year && b.year.includes(query)));
            if(currentCat !== 'all') filtered = filtered.filter(b => b[currentCat === 'fav' ? 'favorite' : currentCat === 'marked' ? 'marked' : 'isPend']);

            filtered.forEach(book => {
                const div = document.createElement('div'); div.className = 'book-card'; div.onclick = () => openBookDetail(book.id);
                div.innerHTML = `<div class="book-cover">${book.cover.startsWith('data') ? `<img src="${book.cover}">` : book.cover}</div><div style="padding:15px"><b>${book.title}</b><br><small>${book.author}</small></div>`;
                grid.appendChild(div);
            });
            if(currentCat === 'all') {
                const add = document.createElement('div'); add.className = 'book-card'; add.style.border="2px dashed #444"; add.style.display="flex"; add.style.justifyContent="center"; add.style.alignItems="center"; add.style.fontSize="40px"; add.innerText = '+'; add.onclick = openBookModal; grid.appendChild(add);
            }
        }

        function openBookDetail(id) {
            currentBookId = id; const b = allBooks.find(x => x.id === id);
            document.getElementById('books-grid-container').style.display = 'none';
            document.getElementById('book-detail-view').style.display = 'block';
            document.getElementById('det-title').innerText = b.title;
            document.getElementById('det-author').innerText = b.author;
            document.getElementById('det-meta').innerText = (b.year ? "Año: "+b.year : "") + (b.readDate ? " | Leído: "+b.readDate : "");
            document.getElementById('det-img-container').innerHTML = b.cover.startsWith('data') ? `<img src="${b.cover}">` : b.cover;
            document.getElementById('comment-text').innerText = b.comment || "Sin comentarios.";
        }

        async function processImg(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX = 800;
                        let w = img.width, h = img.height;
                        if(w > MAX) { h *= MAX/w; w = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.6));
                    };
                };
            });
        }

        function openBookModal() { showModal(`<div class="modal-content"><h2>Nuevo Libro</h2><input type="text" id="bt" placeholder="Título"><input type="text" id="ba" placeholder="Autor"><input type="text" id="by" placeholder="Año"><input type="text" id="br" placeholder="Fecha lectura"><input type="file" id="bf"><button onclick="saveBook()" class="btn-action" style="background:white; color:black; width:100%">Guardar</button><button onclick="closeModal()" style="background:none; color:white; border:none; margin-top:10px; cursor:pointer;">Cancelar</button></div>`); }
        async function saveBook() {
            const t = document.getElementById('bt').value, f = document.getElementById('bf').files[0];
            if(!t) return; let cov = '📖'; if(f) cov = await processImg(f);
            allBooks.push({ id: Date.now(), userId: currentUser, title: t, author: document.getElementById('ba').value.toUpperCase(), cover: cov, year: document.getElementById('by').value, readDate: document.getElementById('br').value, favorite: false, marked: false, isPend: false, comment: "", pages: [] });
            await sync(); closeModal(); renderBooks();
        }

        function openEditBookModal() {
            const b = allBooks.find(x => x.id === currentBookId);
            showModal(`<div class="modal-content"><h2>Editar Libro</h2><input type="text" id="et" value="${b.title}"><input type="text" id="ea" value="${b.author}"><input type="text" id="ey" value="${b.year || ''}"><input type="text" id="er" value="${b.readDate || ''}"><input type="file" id="ef"><div style="display:flex; gap:10px;"><button onclick="closeModal()" style="flex:1">Cancelar</button><button onclick="upB()" style="flex:1; background:white; color:black;">Guardar</button></div></div>`);
        }
        async function upB() {
            const b = allBooks.find(x => x.id === currentBookId); const f = document.getElementById('ef').files[0];
            if(f) b.cover = await processImg(f);
            b.title = document.getElementById('et').value; b.author = document.getElementById('ea').value.toUpperCase();
            b.year = document.getElementById('ey').value; b.readDate = document.getElementById('er').value;
            await sync(); closeModal(); openBookDetail(currentBookId); renderBooks();
        }

        function openAllPagesView() {
            const b = allBooks.find(x => x.id === currentBookId);
            let content = (b.pages || []).map((p, i) => `<div style="margin-bottom:20px; border-bottom:1px solid #333; padding-bottom:10px;"><img src="${p.img}" style="width:100%; cursor:zoom-in;" onclick="zoomImg(${i})"><p>Página ${p.num}</p><button onclick="delP(${i})" style="color:red; background:none; border:none;">Borrar</button></div>`).join('');
            showModal(`<div style="background:#141414; width:100%; height:100%; overflow-y:auto; padding:20px;"><h2>Páginas Destacadas</h2><button onclick="openAddPageModal()" style="background:white; color:black; padding:10px; border:none; border-radius:4px; margin-bottom:20px;">+ Añadir Página</button>${content}<button onclick="closeModal()" style="width:100%; margin-top:20px; background:#444; color:white; border:none; padding:10px;">Cerrar</button></div>`);
        }

        function zoomImg(idx) {
            const b = allBooks.find(x => x.id === currentBookId);
            currentZoomIdx = idx; document.getElementById('zoom-img').src = b.pages[idx].img;
            document.getElementById('zoom-overlay').style.display = 'flex';
        }

        function changeZoomIdx(dir, event) {
            event.stopPropagation(); const b = allBooks.find(x => x.id === currentBookId);
            currentZoomIdx = (currentZoomIdx + dir + b.pages.length) % b.pages.length;
            document.getElementById('zoom-img').src = b.pages[currentZoomIdx].img;
        }

        function openAddPageModal() { showModal(`<div class="modal-content"><h2>Nueva Página</h2><input type="number" id="pn" placeholder="Número"><textarea id="pc" placeholder="Nota"></textarea><input type="file" id="pf"><button onclick="saveP()" style="background:white; color:black; width:100%; padding:10px;">Guardar</button></div>`); }
        async function saveP() {
            const f = document.getElementById('pf').files[0]; if(!f) return; const img = await processImg(f);
            const b = allBooks.find(x => x.id === currentBookId); if(!b.pages) b.pages = [];
            b.pages.push({ num: document.getElementById('pn').value, comm: document.getElementById('pc').value, img: img });
            await sync(); openAllPagesView();
        }

        async function delP(idx) { const b = allBooks.find(x => x.id === currentBookId); b.pages.splice(idx,1); await sync(); openAllPagesView(); }
        function showCategory(cat) { currentCat = cat; document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active')); document.getElementById('btn-'+cat)?.classList.add('active'); closeBookDetail(); renderBooks(); }
        function closeBookDetail() { document.getElementById('book-detail-view').style.display = 'none'; document.getElementById('books-grid-container').style.display = 'block'; }
        function logout() { document.getElementById('main-interface').style.display = 'none'; document.getElementById('profile-selection').style.display = 'flex'; document.querySelector('.sidebar').classList.remove('mobile-active'); }
        function showModal(c) { document.getElementById('modal-dynamic-content').innerHTML = c; document.getElementById('modal-overlay').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        async function deleteBook() { if(confirm("¿Borrar libro?")) { allBooks = allBooks.filter(b => b.id !== currentBookId); await sync(); closeBookDetail(); renderBooks(); } }
        function openEditCommentModal() { const b = allBooks.find(x => x.id === currentBookId); showModal(`<div class="modal-content"><h2>Comentario</h2><textarea id="nc" rows="6">${b.comment || ''}</textarea><button onclick="saveC()" style="background:white; color:black; width:100%; padding:10px;">Guardar</button></div>`); }
        async function saveC() { const b = allBooks.find(x => x.id === currentBookId); b.comment = document.getElementById('nc').value; document.getElementById('comment-text').innerText = b.comment; await sync(); closeModal(); }
        function openProfileModal() { showModal(`<div class="modal-content"><h2>Perfil</h2><input type="text" id="pn" placeholder="Nombre"><input type="file" id="pa"><button onclick="saveProf()" style="background:white; color:black; width:100%; padding:10px;">Crear</button></div>`); }
        async function saveProf() { const f = document.getElementById('pa').files[0]; let a = '👤'; if(f) a = await processImg(f); profiles.push({ name: document.getElementById('pn').value.toUpperCase(), avatar: a }); await sync(); closeModal(); renderProfiles(); }
        function openSortModal() { showModal(`<div class="modal-content"><h2>Ordenar</h2><button onclick="sortB('title')" style="width:100%; margin-bottom:10px;">Título</button><button onclick="sortB('year')" style="width:100%;">Año</button></div>`); }
        function sortB(k) { allBooks.sort((a,b) => (a[k]||"").toString().localeCompare((b[k]||"").toString())); if(k==='year') allBooks.sort((a,b)=>parseInt(b.year||0)-parseInt(a.year||0)); renderBooks(); closeModal(); }
    </script>
</body>
</html>
