<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookFlix</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    
    <style>
        :root { --bg: #141414; --sb: #000; --acc: #e50914; --txt: #fff; --gry: #b3b3b3; }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin:0; overflow-x:hidden; }
        
        /* ESTÉTICA ORIGINAL (TU CÓDIGO) */
        #profile-screen { position:fixed; top:0; left:0; width:100%; height:100vh; background:var(--bg); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .p-card { width:120px; text-align:center; cursor:pointer; margin:15px; }
        .p-avatar { width:120px; height:120px; border-radius:4px; background:#333; margin-bottom:10px; border:3px solid transparent; overflow:hidden; }
        .p-card:hover .p-avatar { border-color:var(--txt); }

        #app-ui { display:none; grid-template-columns: 250px 1fr; min-height:100vh; }
        
        .sidebar { background:var(--sb); padding:20px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; border-right:1px solid #333; }
        .sb-user { display:flex; align-items:center; gap:10px; margin-bottom:30px; }
        .nav-btn { background:none; border:none; color:var(--gry); padding:10px; font-size:16px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:10px; border-radius:4px; transition:0.2s; }
        .nav-btn:hover { color:var(--txt); }
        .nav-btn.active { color:var(--txt); font-weight:bold; }
        
        /* BARRA MÓVIL CORREGIDA (TU ESTÉTICA + FIX ABAJO) */
        @media (max-width: 768px) {
            #app-ui { grid-template-columns: 1fr; padding-bottom: 80px; }
            .sidebar { 
                display:flex !important; flex-direction:row !important; justify-content:space-around;
                position:fixed !important; bottom:0 !important; top:auto !important; left:0; width:100%; height:60px;
                background:rgba(0,0,0,0.95); border-top:1px solid #333; z-index:1000; padding:0;
            }
            .sb-user, .nav-txt { display:none; }
            .nav-btn { flex:1; justify-content:center; font-size:24px; }
        }

        /* GRID Y TARJETAS ORIGINALES */
        #main-content { padding:30px; }
        .toolbar { display:flex; gap:10px; margin-bottom:20px; }
        #search { flex:1; padding:10px; background:#000; border:1px solid #333; color:white; border-radius:4px; }
        
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:20px; }
        .card { background:#181818; border-radius:4px; overflow:hidden; transition:0.3s; cursor:pointer; position:relative; }
        .card:hover { transform:scale(1.05); z-index:10; }
        .c-img { height:240px; background:#222; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .c-info { padding:10px; }
        .add-card { border:2px dashed #444; display:flex; align-items:center; justify-content:center; font-size:40px; color:#444; height:300px; }

        /* VISTA DETALLE Y MODALES */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; display:none; justify-content:center; align-items:center; }
        .modal-box { background:#181818; padding:30px; border-radius:8px; width:90%; max-width:500px; max-height:90vh; overflow-y:auto; }
        input, textarea, select { width:100%; padding:10px; margin:5px 0 15px; background:#333; border:none; color:white; border-radius:4px; box-sizing:border-box; }
        .modal-btns { display:flex; gap:10px; margin-top:20px; }
        .modal-btns button { flex:1; padding:12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; color:white; }

        /* ESTRELLAS Y EDICIÓN */
        .star-w { display:inline-block; position:relative; cursor:pointer; font-size:30px; color:#444; }
        .star-f { position:absolute; top:0; left:0; overflow:hidden; color:#ffd700; width:0%; pointer-events:none; }
        
        /* DETALLE ESTILO NETFLIX */
        #detail-view { position:fixed; top:0; left:0; width:100%; height:100%; background:#141414; z-index:1500; display:none; flex-direction:column; overflow-y:auto; padding:20px; box-sizing:border-box; }
        .dt-grid { display:grid; grid-template-columns: 300px 1fr; gap:30px; max-width:1000px; margin:0 auto; }
        @media (max-width: 768px) { .dt-grid { grid-template-columns: 1fr; } }
        
        /* LÁPIZ DE EDICIÓN */
        .comment-box { background:#222; padding:15px; border-radius:8px; position:relative; margin-top:20px; }
        .edit-pencil { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:20px; }
    </style>
</head>
<body>

    <div id="profile-screen">
        <h1 style="color:var(--acc); font-size:50px; margin-bottom:40px; font-weight:900">BOOKFLIX</h1>
        <div id="profiles-container" style="display:flex; flex-wrap:wrap; justify-content:center"></div>
        <button onclick="openModal('newProf')" style="margin-top:30px; background:none; border:1px solid #444; color:#888; padding:10px 20px; cursor:pointer">Administrar Perfiles</button>
    </div>

    <div id="app-ui">
        <div class="sidebar">
            <div class="sb-user">
                <img id="sb-avatar" style="width:40px; height:40px; border-radius:4px; object-fit:cover">
                <b id="sb-name">Usuario</b>
            </div>
            <button class="nav-btn active" id="btn-all" onclick="setFilter('all')">📚 <span class="nav-txt">Inicio</span></button>
            <button class="nav-btn" id="btn-fav" onclick="setFilter('fav')">❤️ <span class="nav-txt">Favoritos</span></button>
            <button class="nav-btn" id="btn-pend" onclick="setFilter('pend')">⏳ <span class="nav-txt">Pendientes</span></button>
            <button class="nav-btn" id="btn-done" onclick="setFilter('done')">✅ <span class="nav-txt">Leídos</span></button>
            <div style="flex:1"></div>
            <button class="nav-btn" onclick="openSort()">🔃 <span class="nav-txt">Ordenar</span></button>
            <button class="nav-btn" onclick="logout()" style="color:#e50914">🚪 <span class="nav-txt">Salir</span></button>
        </div>

        <div id="main-content">
            <div class="toolbar">
                <input id="search" placeholder="Títulos, géneros, gente..." oninput="render()">
            </div>
            <div id="grid" class="grid"></div>
        </div>
    </div>

    <div id="detail-view">
        <button onclick="closeDetail()" style="align-self:flex-start; margin-bottom:20px; background:none; border:none; color:white; font-size:24px; cursor:pointer">← Volver</button>
        <div class="dt-grid">
            <div id="dt-img" style="border-radius:8px; overflow:hidden; background:#000;"></div>
            <div>
                <h1 id="dt-title" style="margin-top:0; font-size:40px">Título</h1>
                <div style="display:flex; align-items:center; gap:15px; margin:15px 0">
                    <div id="dt-stars" style="display:flex"></div>
                    <span id="dt-meta" style="color:#888; font-weight:bold">2024 | Autor</span>
                </div>
                
                <div class="comment-box">
                    <button class="edit-pencil" onclick="openComment()">✏️</button>
                    <p id="dt-comment" style="margin:0; color:#ddd; min-height:40px; white-space:pre-wrap">Sin reseña...</p>
                </div>

                <div style="display:flex; gap:15px; margin-top:30px">
                    <button onclick="toggleFav()" id="btn-fav-act" style="background:white; color:black; border:none; padding:10px 20px; font-weight:bold; border-radius:4px; cursor:pointer">Favoritos</button>
                    <button onclick="togglePend()" id="btn-pend-act" style="background:#444; color:white; border:none; padding:10px 20px; font-weight:bold; border-radius:4px; cursor:pointer">Pendiente</button>
                    <button onclick="openEdit()" style="background:#444; color:white; border:none; padding:10px 20px; font-weight:bold; border-radius:4px; cursor:pointer">Editar</button>
                    <button onclick="deleteBook()" style="background:none; border:1px solid #e50914; color:#e50914; padding:10px 20px; font-weight:bold; border-radius:4px; cursor:pointer">Borrar</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-wrapper" class="modal-overlay"><div id="modal-c" class="modal-box"></div></div>

    <script>
        // --- PEGA AQUÍ TU CONFIGURACIÓN (OJO AL PROJECT ID) ---
        const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUI", // <--- TU CLAVE
            authDomain: "bookflix-34356.firebaseapp.com",
            projectId: "bookflix-34356", // <--- SIN .firebasestorage
            storageBucket: "bookflix-34356.firebasestorage.app", 
            messagingSenderId: "567651297193",
            appId: "1:567651297193:web:48175e8d3697d4d52686b8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        // ESTADO
        let books=[], profiles=[], user=null, curId=null, filter='all', sortKey='title', sortOrder=1;

        async function init(){
            try {
                // Recuperar datos
                const d = (await db.collection('data').doc('library').get()).data();
                books = d?.books||[]; profiles = d?.profiles||[];
                
                // Login persistente
                const saved = localStorage.getItem('bf_user');
                if(saved && profiles.find(p=>p.name===saved)) login(profiles.find(p=>p.name===saved));
                else renderProfs();

            } catch(e){ console.error(e); }
        }

        async function save(){ await db.collection('data').doc('library').set({books,profiles}); }

        // --- SUBIDA DE IMÁGENES AL BUCKET (SOLUCIÓN SPACE) ---
        async function uploadToBucket(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX = 1000;
                        let w = img.width, h = img.height;
                        if(w > MAX) { h *= MAX/w; w = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(async (blob) => {
                            const ref = storage.ref().child(`imgs/${Date.now()}.jpg`);
                            await ref.put(blob);
                            const url = await ref.getDownloadURL();
                            resolve(url);
                        }, 'image/jpeg', 0.8);
                    };
                };
            });
        }

        // --- LÓGICA DE USUARIOS ---
        function renderProfs() {
            document.getElementById('profile-screen').style.display = 'flex';
            const c=document.getElementById('profiles-container'); c.innerHTML='';
            profiles.forEach(p=>{
                const d=document.createElement('div'); d.className='p-card'; d.onclick=()=>login(p);
                const img = (p.avatar && p.avatar.length > 5) ? `<img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover">` : `<div style="font-size:50px;line-height:120px">👤</div>`;
                d.innerHTML=`<div class="p-avatar">${img}</div><b>${p.name}</b>`;
                c.appendChild(d);
            });
        }
        function login(p){ 
            user=p.name; localStorage.setItem('bf_user', user);
            document.getElementById('profile-screen').style.display='none'; 
            document.getElementById('app-ui').style.display='grid'; 
            document.getElementById('sb-name').innerText=p.name; 
            document.getElementById('sb-avatar').src= p.avatar.length > 5 ? p.avatar : '';
            render(); 
        }

        // --- RENDERIZADO PRINCIPAL ---
        function render() {
            const g = document.getElementById('grid'); g.innerHTML = '';
            let list = books.filter(b => b.user === user);
            
            // Filtros Texto
            const search = document.getElementById('search').value.toLowerCase();
            if(search) list = list.filter(b => b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search));
            
            // Filtros Categoría
            if(filter === 'fav') list = list.filter(b => b.fav);
            if(filter === 'pend') list = list.filter(b => b.pend);
            if(filter === 'done') list = list.filter(b => !b.pend && b.readDate);

            // Ordenación
            list.sort((a,b) => {
                let vA = (a[sortKey]||"").toString().toLowerCase();
                let vB = (b[sortKey]||"").toString().toLowerCase();
                if(sortKey==='year' || sortKey==='rating' || sortKey==='readDate') return vB.localeCompare(vA, undefined, {numeric:true});
                return vA.localeCompare(vB);
            });

            list.forEach(b => {
                const d = document.createElement('div'); d.className = 'card';
                d.onclick = () => showDetail(b.id);
                const cover = (b.cover && b.cover.length > 5) ? `<img src="${b.cover}" style="width:100%;height:100%;object-fit:cover">` : `<div style="font-size:50px;color:#444">📖</div>`;
                d.innerHTML = `<div class="c-img">${cover}</div><div class="c-info"><b>${b.title}</b><br><small style="color:#888">${b.author}</small><div style="color:#ffd700;margin-top:5px">${'★'.repeat(Math.floor(b.rating||0))}</div></div>`;
                g.appendChild(d);
            });

            if(filter === 'all' && !search) {
                const add = document.createElement('div'); add.className = 'card add-card';
                add.onclick = () => openModal('new'); add.innerHTML = '+'; g.appendChild(add);
            }
        }

        // --- GUARDADO CON BUCKET ---
        async function saveNew() {
            const btn = document.getElementById('btn-save');
            const t = document.getElementById('inp-title').value; 
            if(!t) return alert("Falta el título");
            
            btn.disabled = true; btn.innerText = "Subiendo...";
            const f = document.getElementById('inp-file').files[0];
            let cov = '📖'; 
            if(f) cov = await uploadToBucket(f);

            books.push({
                id: Date.now(), user: user, title: t, 
                author: document.getElementById('inp-auth').value.toUpperCase(),
                year: document.getElementById('inp-year').value,
                readDate: document.getElementById('inp-date').value,
                cover: cov, fav: false, pend: false, rating: 0, comment: "", pages: []
            });
            await save(); closeModal(); render();
        }

        // --- DETALLE Y ESTRELLAS ---
        function showDetail(id) {
            curId = id; const b = books.find(x => x.id === id);
            document.getElementById('app-ui').style.display = 'none';
            document.getElementById('detail-view').style.display = 'flex';
            
            const img = (b.cover && b.cover.length > 5) ? `<img src="${b.cover}" style="width:100%;height:auto;max-height:50vh;object-fit:contain">` : '<div style="font-size:100px;text-align:center">📖</div>';
            
            let starsHTML = '';
            for(let i=1; i<=5; i++){
                let fill = b.rating >= i ? '100%' : (b.rating > i-1 ? '50%' : '0%');
                starsHTML += `<div class="star-w" onclick="rate(${i}, event)"><div class="star-f" style="width:${fill}">★</div>★</div>`;
            }

            document.getElementById('dt-img').innerHTML = img;
            document.getElementById('dt-title').innerText = b.title;
            document.getElementById('dt-stars').innerHTML = starsHTML;
            document.getElementById('dt-meta').innerText = `${b.year || 'Sin año'} | ${b.author}`;
            document.getElementById('dt-comment').innerText = b.comment || "Sin reseña...";
            
            // Botones estado
            document.getElementById('btn-fav-act').style.background = b.fav ? '#e50914' : 'white';
            document.getElementById('btn-fav-act').style.color = b.fav ? 'white' : 'black';
            document.getElementById('btn-pend-act').style.border = b.pend ? '2px solid #3498db' : 'none';
        }

        async function rate(star, e) {
            const rect = e.target.parentElement.getBoundingClientRect();
            const isHalf = (e.clientX - rect.left) < (rect.width / 2);
            books.find(x => x.id === curId).rating = isHalf ? star - 0.5 : star;
            await save(); showDetail(curId);
        }

        function openModal(type) {
            const w = document.getElementById('modal-wrapper'); const c = document.getElementById('modal-c'); w.style.display='flex';
            if(type==='new') c.innerHTML = `<h2>Nuevo</h2><input id="inp-title" placeholder="Título"><input id="inp-auth" placeholder="Autor"><input id="inp-year" type="number" placeholder="Año"><input id="inp-date" type="date"><p>Portada:</p><input id="inp-file" type="file"><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button id="btn-save" onclick="saveNew()" style="background:#e50914">Guardar</button></div>`;
            if(type==='comment') c.innerHTML = `<h2>Reseña</h2><textarea id="edit-comment" rows="5">${books.find(x=>x.id===curId).comment||''}</textarea><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button onclick="saveComment()" style="background:#e50914">Guardar</button></div>`;
            if(type==='sort') c.innerHTML = `<h2>Ordenar por</h2><button class="nav-btn" onclick="doSort('title')">🅰️ Título</button><button class="nav-btn" onclick="doSort('year')">📅 Año</button><button class="nav-btn" onclick="doSort('readDate')">📆 Fecha</button><button class="nav-btn" onclick="doSort('rating')">⭐ Estrellas</button><button onclick="closeModal()" style="margin-top:20px;background:#444;width:100%">Cancelar</button>`;
            if(type==='newProf') c.innerHTML = `<h2>Nuevo Perfil</h2><input id="np-name" placeholder="Nombre"><input id="np-file" type="file"><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button onclick="saveProfile()" style="background:#e50914">Crear</button></div>`;
        }

        async function saveComment() { books.find(x=>x.id===curId).comment = document.getElementById('edit-comment').value; await save(); closeModal(); showDetail(curId); }
        async function saveProfile() { 
            const f = document.getElementById('np-file').files[0]; let av = '👤'; if(f) av = await uploadToBucket(f);
            profiles.push({name:document.getElementById('np-name').value.toUpperCase(), avatar:av}); await save(); closeModal(); renderProfs(); 
        }
        function doSort(k) { sortKey=k; render(); closeModal(); }
        function closeModal() { document.getElementById('modal-wrapper').style.display='none'; }
        function closeDetail() { document.getElementById('detail-view').style.display='none'; document.getElementById('app-ui').style.display='grid'; render(); }
        function openComment() { openModal('comment'); }
        function openSort() { openModal('sort'); }
        async function toggleFav() { const b=books.find(x=>x.id===curId); b.fav=!b.fav; await save(); showDetail(curId); }
        async function togglePend() { const b=books.find(x=>x.id===curId); b.pend=!b.pend; await save(); showDetail(curId); }
        async function deleteBook() { if(confirm("¿Borrar?")) { books=books.filter(x=>x.id!==curId); await save(); closeDetail(); } }
        function setFilter(f) { filter=f; render(); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+f).classList.add('active'); }
        function logout() { localStorage.removeItem('bf_user'); location.reload(); }

        init();
    </script>
</body>
</html>
