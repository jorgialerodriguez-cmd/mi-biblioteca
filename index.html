<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookFlix Pro</title>

<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>

<style>
/* ==== ESTILOS (sin cambios funcionales) ==== */
:root {
  --bg:#141414; --sidebar:#000; --accent:#e50914;
  --text:white; --gray:#b3b3b3;
}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial;height:100vh;overflow:hidden}
.books-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:20px}
.book-card{background:#222;height:300px;border-radius:4px;cursor:pointer;overflow:hidden}
.book-cover{height:220px;background:#333;display:flex;align-items:center;justify-content:center}
.book-cover img{width:100%;height:100%;object-fit:cover}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;justify-content:center;align-items:center;z-index:3000}
.modal-content{background:#222;padding:25px;border-radius:8px;width:90%;max-width:450px}
.btn{padding:10px;border:none;border-radius:4px;cursor:pointer}
</style>
</head>

<body onload="initApp()">

<!-- ==== PERFIL ==== -->
<div id="profile-selection">
  <h1 style="color:#e50914;text-align:center">BOOKFLIX</h1>
  <div id="profiles-container" style="display:flex;gap:20px;justify-content:center"></div>
</div>

<!-- ==== APP ==== -->
<div id="main-interface" style="display:none;height:100vh">
  <input id="main-search" placeholder="Buscar..." oninput="renderBooks()">
  <div class="books-grid" id="books-grid"></div>
</div>

<div class="modal-overlay" id="modal-overlay">
  <div id="modal-content"></div>
</div>

<script>
/* ================== FIREBASE ================== */
firebase.initializeApp({
  apiKey: "AIzaSyAoXp6vTOEhk3UCt-SmjNLmb2SUQaZERXc",
  authDomain: "bookflix-34356.firebaseapp.com",
  projectId: "bookflix-34356"
});
const db = firebase.firestore();

/* ================== DOM CACHE ================== */
const DOM = {
  profiles: document.getElementById('profiles-container'),
  profileGate: document.getElementById('profile-selection'),
  app: document.getElementById('main-interface'),
  grid: document.getElementById('books-grid'),
  search: document.getElementById('main-search'),
  modal: document.getElementById('modal-overlay'),
  modalContent: document.getElementById('modal-content')
};

/* ================== STATE ================== */
let profiles = [];
let allBooks = [];
let booksMap = new Map();
let currentUser = null;
let syncTimer = null;

/* ================== UTILS ================== */
const uid = () => crypto.randomUUID();
const debounceSync = () => {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    db.collection('data').doc('library').set({profiles, books: allBooks});
  }, 800);
};

/* ================== INIT ================== */
async function initApp(){
  const doc = await db.collection('data').doc('library').get();
  if(doc.exists){
    profiles = doc.data().profiles || [];
    allBooks = doc.data().books || [];
  } else {
    profiles = [{name:'JORGE',avatar:'👦'}];
  }
  rebuildMap();
  renderProfiles();
}

function rebuildMap(){
  booksMap.clear();
  allBooks.forEach(b=>booksMap.set(b.id,b));
}

/* ================== PROFILES ================== */
function renderProfiles(){
  DOM.profiles.innerHTML='';
  profiles.forEach(p=>{
    const d=document.createElement('div');
    d.style.cursor='pointer';
    d.innerHTML=`<div style="font-size:50px">${p.avatar}</div><b>${p.name}</b>`;
    d.onclick=()=>login(p.name);
    DOM.profiles.appendChild(d);
  });
}

function login(name){
  currentUser=name;
  DOM.profileGate.style.display='none';
  DOM.app.style.display='block';
  renderBooks();
}

/* ================== BOOKS ================== */
function getFilteredBooks(){
  const q=DOM.search.value.toLowerCase();
  return allBooks.filter(b =>
    b.userId===currentUser &&
    (!q || b.title.toLowerCase().includes(q) || b.author.toLowerCase().includes(q))
  );
}

function renderBooks(){
  DOM.grid.innerHTML='';
  getFilteredBooks().forEach(b=>{
    const d=document.createElement('div');
    d.className='book-card';
    d.innerHTML=`
      <div class="book-cover">
        ${b.cover?.startsWith('data')?`<img loading="lazy" src="${b.cover}">`:b.cover||'📖'}
      </div>
      <div style="padding:10px"><b>${b.title}</b><br>${b.author}</div>`;
    DOM.grid.appendChild(d);
  });

  const add=document.createElement('div');
  add.className='book-card';
  add.style.display='flex';
  add.style.alignItems='center';
  add.style.justifyContent='center';
  add.style.fontSize='40px';
  add.textContent='+';
  add.onclick=openAddBook;
  DOM.grid.appendChild(add);
}

/* ================== MODALS ================== */
function showModal(html){
  DOM.modalContent.innerHTML=html;
  DOM.modal.style.display='flex';
}
function closeModal(){DOM.modal.style.display='none';}

function openAddBook(){
  showModal(`
    <div class="modal-content">
      <h2>Nuevo Libro</h2>
      <input id="t" placeholder="Título"><br><br>
      <input id="a" placeholder="Autor"><br><br>
      <button class="btn" onclick="saveBook()">Guardar</button>
      <button class="btn" onclick="closeModal()">Cancelar</button>
    </div>`);
}

function saveBook(){
  const t=document.getElementById('t').value;
  const a=document.getElementById('a').value.toUpperCase();
  if(!t) return;
  allBooks.push({
    id:uid(), userId:currentUser,
    title:t, author:a, cover:'📖'
  });
  rebuildMap();
  debounceSync();
  closeModal();
  renderBooks();
}
</script>
</body>
</html>
