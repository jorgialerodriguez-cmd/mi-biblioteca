<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BookFlix</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-storage-compat.js"></script>
    
    <style>
        :root { --bg: #141414; --sb: #000; --acc: #e50914; --txt: #fff; --gry: #b3b3b3; --red: #e50914; }
        body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin:0; overflow-x:hidden; }
        
        /* --- ESTÉTICA ORIGINAL TUYA --- */
        #profile-screen { position:fixed; top:0; left:0; width:100%; height:100vh; background:var(--bg); z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; }
        .p-card { width:120px; text-align:center; cursor:pointer; margin:15px; }
        .p-avatar { width:120px; height:120px; border-radius:4px; background:#333; margin-bottom:10px; border:3px solid transparent; overflow:hidden; }
        .p-card:hover .p-avatar { border-color:var(--txt); }

        #app-ui { display:none; grid-template-columns: 250px 1fr; min-height:100vh; }
        
        .sidebar { background:var(--sb); padding:20px; position:sticky; top:0; height:100vh; display:flex; flex-direction:column; border-right:1px solid #333; }
        .sb-user { display:flex; align-items:center; gap:10px; margin-bottom:30px; }
        .nav-btn { background:none; border:none; color:var(--gry); padding:10px; font-size:16px; cursor:pointer; text-align:left; display:flex; align-items:center; gap:10px; border-radius:4px; transition:0.2s; }
        .nav-btn:hover { color:var(--txt); }
        .nav-btn.active { color:var(--txt); font-weight:bold; }
        
        /* --- BARRA MÓVIL CORREGIDA (FIX ABAJO) --- */
        @media (max-width: 768px) {
            #app-ui { grid-template-columns: 1fr; padding-bottom: 80px; }
            .sidebar { 
                display:flex !important; flex-direction:row !important; justify-content:space-around;
                position:fixed !important; bottom:0 !important; top:auto !important; left:0; width:100%; height:60px;
                background:rgba(0,0,0,0.95); border-top:1px solid #333; z-index:1000; padding:0;
            }
            .sb-user, .nav-txt { display:none; }
            .nav-btn { flex:1; justify-content:center; font-size:24px; margin:0; }
        }

        /* --- GRID Y TARJETAS ORIGINALES --- */
        #main-content { padding:30px; }
        .toolbar { display:flex; gap:10px; margin-bottom:20px; }
        #search { flex:1; padding:10px; background:#000; border:1px solid #333; color:white; border-radius:4px; }
        .btn-sort { padding:10px 20px; background:#333; color:white; border:none; border-radius:4px; cursor:pointer; }
        
        .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap:20px; }
        .card { background:#181818; border-radius:4px; overflow:hidden; transition:0.3s; cursor:pointer; position:relative; }
        .card:hover { transform:scale(1.05); z-index:10; }
        .c-img { height:240px; background:#222; display:flex; align-items:center; justify-content:center; overflow:hidden; }
        .c-info { padding:10px; }
        .add-card { border:2px dashed #444; display:flex; align-items:center; justify-content:center; font-size:40px; color:#444; min-height:300px; cursor:pointer; }

        /* --- DETALLE Y MODALES --- */
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:2000; display:none; justify-content:center; align-items:center; }
        .modal-box { background:#181818; padding:30px; border-radius:8px; width:90%; max-width:500px; max-height:90vh; overflow-y:auto; }
        input, textarea, select { width:100%; padding:10px; margin:5px 0 15px; background:#333; border:none; color:white; border-radius:4px; box-sizing:border-box; }
        .modal-btns { display:flex; gap:10px; margin-top:20px; }
        .modal-btns button { flex:1; padding:12px; border:none; border-radius:4px; font-weight:bold; cursor:pointer; color:white; }

        /* VISTA DETALLE */
        #detail-view { position:fixed; top:0; left:0; width:100%; height:100%; background:#141414; z-index:1500; display:none; flex-direction:column; overflow-y:auto; padding:30px; box-sizing:border-box; }
        .dt-grid { display:grid; grid-template-columns: 300px 1fr; gap:30px; max-width:1000px; margin:0 auto; width:100%; }
        @media (max-width: 768px) { .dt-grid { grid-template-columns: 1fr; } #detail-view { padding:20px; padding-bottom:100px; } }
        
        /* EXTRAS (Lápiz y Estrellas) */
        .star-w { display:inline-block; position:relative; cursor:pointer; font-size:30px; color:#444; }
        .star-f { position:absolute; top:0; left:0; overflow:hidden; color:#ffd700; width:0%; pointer-events:none; }
        
        .comment-area { background:#222; padding:15px; border-radius:8px; position:relative; margin-top:20px; }
        .pencil-btn { position:absolute; top:10px; right:10px; background:none; border:none; cursor:pointer; font-size:18px; }
        
        .active-icon { filter: brightness(1.5); color: var(--acc); }
    </style>
</head>
<body>

    <div id="profile-screen">
        <h1 style="color:var(--acc); font-size:50px; margin-bottom:40px; font-weight:900">BOOKFLIX</h1>
        <div id="profiles-container" style="display:flex; flex-wrap:wrap; justify-content:center"></div>
        <button onclick="openModal('newProf')" style="margin-top:30px; background:none; border:1px solid #444; color:#888; padding:10px 20px; cursor:pointer">Nuevo Perfil</button>
    </div>

    <div id="app-ui">
        <div class="sidebar">
            <div class="sb-user">
                <img id="sb-avatar" style="width:40px; height:40px; border-radius:4px; object-fit:cover">
                <b id="sb-name">Usuario</b>
            </div>
            <button class="nav-btn active" id="btn-all" onclick="setFilter('all')">📚 <span class="nav-txt">Biblioteca</span></button>
            <button class="nav-btn" id="btn-fav" onclick="setFilter('fav')">❤️ <span class="nav-txt">Favoritos</span></button>
            <button class="nav-btn" id="btn-marked" onclick="setFilter('marked')">🔖 <span class="nav-txt">Marcados</span></button>
            <button class="nav-btn" id="btn-pend" onclick="setFilter('pend')">⏳ <span class="nav-txt">Pendientes</span></button>
            <div style="flex:1"></div>
            <button class="nav-btn" onclick="openSort()">🔃 <span class="nav-txt">Ordenar</span></button>
            <button class="nav-btn" onclick="openModal('settings')">⚙️ <span class="nav-txt">Ajustes</span></button>
            <button class="nav-btn" onclick="logout()" style="color:#e50914">🚪 <span class="nav-txt">Salir</span></button>
        </div>

        <div id="main-content">
            <div class="toolbar">
                <input id="search" placeholder="Buscar título o autor..." oninput="render()">
                <button class="btn-sort" onclick="openSort()">Ordenar</button>
            </div>
            <div id="grid" class="grid"></div>
        </div>
    </div>

    <div id="detail-view">
        <button onclick="closeDetail()" style="align-self:flex-start; margin-bottom:20px; background:none; border:none; color:white; font-size:24px; cursor:pointer">← Volver</button>
        <div class="dt-grid">
            <div id="dt-img" style="border-radius:8px; overflow:hidden; background:#000;"></div>
            <div>
                <h1 id="dt-title" style="margin-top:0; font-size:40px; line-height:1.1">Título</h1>
                
                <div style="display:flex; align-items:center; gap:15px; margin:15px 0">
                    <div id="dt-stars" style="display:flex"></div>
                    <span id="dt-meta" style="color:#888; font-weight:bold">Año | Autor</span>
                </div>
                
                <div class="comment-area">
                    <button class="pencil-btn" onclick="openComment()">✏️</button>
                    <p id="dt-comment" style="margin:0; color:#ddd; min-height:30px; white-space:pre-wrap; padding-right:30px">Sin reseña...</p>
                </div>

                <div style="display:flex; gap:15px; margin-top:30px; flex-wrap:wrap;">
                    <button onclick="openPages()" style="background:white; color:black; border:none; padding:12px 25px; font-weight:bold; border-radius:4px; cursor:pointer; flex:1; min-width:140px;">📖 Páginas</button>
                    <button id="btn-fav-act" onclick="toggleFav()" style="background:#333; color:white; border:none; padding:12px 20px; font-weight:bold; border-radius:4px; cursor:pointer">❤️</button>
                    <button id="btn-pend-act" onclick="togglePend()" style="background:#333; color:white; border:none; padding:12px 20px; font-weight:bold; border-radius:4px; cursor:pointer">⏳</button>
                    <button onclick="openEdit()" style="background:#333; color:white; border:none; padding:12px 20px; font-weight:bold; border-radius:4px; cursor:pointer">Editar</button>
                    <button onclick="deleteBook()" style="background:none; border:1px solid #e50914; color:#e50914; padding:12px 20px; font-weight:bold; border-radius:4px; cursor:pointer">🗑️</button>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-wrapper" class="modal-overlay"><div id="modal-c" class="modal-box"></div></div>

    <div id="zoom-overlay" onclick="this.style.display='none'" style="position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.95);z-index:5000;display:none;justify-content:center;align-items:center;">
        <img id="zoom-img" style="max-width:95%;max-height:95%;object-fit:contain">
    </div>

    <script>
        // CONFIGURACIÓN FIREBASE (PEGA TU API KEY AQUÍ)
        const firebaseConfig = {
            apiKey: "TU_API_KEY_AQUI", 
            authDomain: "bookflix-34356.firebaseapp.com",
            projectId: "bookflix-34356",
            storageBucket: "bookflix-34356.firebasestorage.app", 
            messagingSenderId: "567651297193",
            appId: "1:567651297193:web:48175e8d3697d4d52686b8"
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        
        // ESTADO GLOBAL
        let books=[], profiles=[], user=null, curId=null, filter='all', sortKey='title';

        // INICIO
        async function init(){
            try {
                const d = (await db.collection('data').doc('library').get()).data();
                books = d?.books||[]; profiles = d?.profiles||[];
                
                const saved = localStorage.getItem('bf_user');
                if(saved && profiles.find(p=>p.name===saved)) login(profiles.find(p=>p.name===saved));
                else renderProfs();
            } catch(e){ console.error(e); }
        }

        async function save(){ await db.collection('data').doc('library').set({books,profiles}); }

        // --- SUBIDA AL BUCKET ---
        async function uploadToBucket(file) {
            return new Promise((resolve) => {
                const reader = new FileReader(); reader.readAsDataURL(file);
                reader.onload = (e) => {
                    const img = new Image(); img.src = e.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas'); const MAX = 1000;
                        let w = img.width, h = img.height;
                        if(w > MAX) { h *= MAX/w; w = MAX; }
                        canvas.width = w; canvas.height = h;
                        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
                        canvas.toBlob(async (blob) => {
                            const ref = storage.ref().child(`imgs/${Date.now()}_${Math.random()}`);
                            await ref.put(blob);
                            resolve(await ref.getDownloadURL());
                        }, 'image/jpeg', 0.8);
                    };
                };
            });
        }

        // --- USUARIOS ---
        function renderProfs() {
            document.getElementById('profile-screen').style.display = 'flex';
            const c=document.getElementById('profiles-container'); c.innerHTML='';
            profiles.forEach(p=>{
                const d=document.createElement('div'); d.className='p-card'; d.onclick=()=>login(p);
                const av = (p.avatar && p.avatar.length>5) ? `<img src="${p.avatar}" style="width:100%;height:100%;object-fit:cover">` : `<div style="font-size:50px;line-height:120px">👤</div>`;
                d.innerHTML=`<div class="p-avatar">${av}</div><b>${p.name}</b>`;
                c.appendChild(d);
            });
        }
        function login(p){ 
            user=p.name; localStorage.setItem('bf_user', user);
            document.getElementById('profile-screen').style.display='none'; 
            document.getElementById('app-ui').style.display='grid'; 
            document.getElementById('sb-name').innerText=p.name; 
            document.getElementById('sb-avatar').src= (p.avatar && p.avatar.length>5) ? p.avatar : '';
            render(); 
        }

        // --- RENDERIZADO ---
        function render() {
            const g = document.getElementById('grid'); g.innerHTML = '';
            let list = books.filter(b => b.user === user);
            const search = document.getElementById('search').value.toLowerCase();
            
            if(search) list = list.filter(b => b.title.toLowerCase().includes(search) || b.author.toLowerCase().includes(search));
            if(filter==='fav') list = list.filter(b=>b.fav);
            if(filter==='pend') list = list.filter(b=>b.pend);
            if(filter==='marked') list = list.filter(b=>b.marked);

            // Ordenar
            list.sort((a,b) => {
                let vA = (a[sortKey]||"").toString().toLowerCase();
                let vB = (b[sortKey]||"").toString().toLowerCase();
                if(sortKey==='year'||sortKey==='readDate'||sortKey==='rating') return vB.localeCompare(vA, undefined, {numeric:true});
                return vA.localeCompare(vB);
            });

            list.forEach(b => {
                const d = document.createElement('div'); d.className = 'card';
                d.onclick = () => showDetail(b.id);
                const cv = (b.cover && b.cover.length>5) ? `<img src="${b.cover}" style="width:100%;height:100%;object-fit:cover">` : `<div style="font-size:50px;color:#444">📖</div>`;
                d.innerHTML = `<div class="c-img">${cv}</div><div class="c-info"><b>${b.title}</b><br><small style="color:#888">${b.author}</small><div style="color:#ffd700">${'★'.repeat(Math.floor(b.rating||0))}</div></div>`;
                g.appendChild(d);
            });

            if(filter==='all' && !search) {
                const add = document.createElement('div'); add.className = 'add-card'; add.innerHTML='+';
                add.onclick = () => openModal('new'); g.appendChild(add);
            }
        }

        // --- DETALLE ---
        function showDetail(id) {
            curId = id; const b = books.find(x => x.id === id);
            document.getElementById('app-ui').style.display='none';
            document.getElementById('detail-view').style.display='flex';
            
            // Portada
            const cv = (b.cover && b.cover.length>5) ? `<img src="${b.cover}" style="width:100%;height:auto;max-height:50vh;object-fit:contain">` : '<div style="font-size:100px;text-align:center;color:#444">📖</div>';
            document.getElementById('dt-img').innerHTML = cv;
            
            // Textos
            document.getElementById('dt-title').innerText = b.title;
            document.getElementById('dt-meta').innerText = `${b.year||'S/A'} | ${b.author}`;
            document.getElementById('dt-comment').innerText = b.comment || "Sin reseña...";
            
            // Estrellas
            let sh = '';
            for(let i=1; i<=5; i++){
                let w = (b.rating >= i) ? '100%' : (b.rating > i-1 ? '50%' : '0%');
                sh += `<div class="star-w" onclick="rate(${i}, event)"><div class="star-f" style="width:${w}">★</div>★</div>`;
            }
            document.getElementById('dt-stars').innerHTML = sh;

            // Botones Estado
            document.getElementById('btn-fav-act').innerText = b.fav ? '❤️' : '🤍';
            document.getElementById('btn-pend-act').innerText = b.pend ? '⏳' : '⌛';
        }

        async function rate(star, e) {
            const rect = e.target.parentElement.getBoundingClientRect();
            const val = (e.clientX - rect.left < rect.width/2) ? star-0.5 : star;
            books.find(x=>x.id===curId).rating = val; await save(); showDetail(curId);
        }

        // --- MODALES ---
        function openModal(type) {
            const w=document.getElementById('modal-wrapper'); const c=document.getElementById('modal-c'); w.style.display='flex';
            if(type==='new') c.innerHTML = `<h2>Nuevo Libro</h2><input id="in-t" placeholder="Título"><input id="in-a" placeholder="Autor"><input id="in-y" type="number" placeholder="Año"><input id="in-d" type="date"><p>Portada:</p><input id="in-f" type="file"><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button onclick="saveBook()" style="background:var(--red)">Guardar</button></div>`;
            if(type==='edit') { const b=books.find(x=>x.id===curId); c.innerHTML = `<h2>Editar</h2><input id="ed-t" value="${b.title}"><input id="ed-a" value="${b.author}"><input id="ed-y" value="${b.year}"><input id="ed-d" type="date" value="${b.readDate}"><p>Portada:</p><input id="ed-f" type="file"><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button onclick="upBook()" style="background:var(--red)">Guardar</button></div>`; }
            if(type==='comment') c.innerHTML = `<h2>Reseña</h2><textarea id="ed-c" rows="5">${books.find(x=>x.id===curId).comment||''}</textarea><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button onclick="saveComm()" style="background:var(--red)">Guardar</button></div>`;
            if(type==='sort') c.innerHTML = `<h2>Ordenar</h2><button onclick="doSort('title')" class="nav-btn">🅰️ Título</button><button onclick="doSort('year')" class="nav-btn">📅 Año</button><button onclick="doSort('readDate')" class="nav-btn">📆 Fecha</button><button onclick="doSort('rating')" class="nav-btn">⭐ Estrellas</button><button onclick="closeModal()" style="margin-top:20px;width:100%;background:#444;color:white;padding:10px;border:none">Cancelar</button>`;
            if(type==='newProf') c.innerHTML = `<h2>Perfil</h2><input id="np-n" placeholder="Nombre"><input id="np-f" type="file"><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cancelar</button><button onclick="saveProf()" style="background:var(--red)">Crear</button></div>`;
            if(type==='settings') { const p=profiles.find(x=>x.name===user); c.innerHTML=`<h2>Ajustes</h2><input id="st-n" value="${p.name}"><button onclick="exportData()" style="width:100%;padding:10px;margin-bottom:10px;background:#333;color:white;border:none">💾 Exportar</button><input type="file" id="imp-f" style="display:none" onchange="importData(event)"><button onclick="document.getElementById('imp-f').click()" style="width:100%;padding:10px;background:#333;color:white;border:none">📂 Importar</button><div class="modal-btns"><button onclick="closeModal()" style="background:#444">Cerrar</button></div>`; }
        }

        // --- ACCIONES DE GUARDADO ---
        async function saveBook() {
            const t = document.getElementById('in-t').value; if(!t) return;
            const btn = event.target; btn.disabled=true; btn.innerText="Subiendo...";
            const f = document.getElementById('in-f').files[0];
            let cov = '📖'; if(f) cov = await uploadToBucket(f);
            
            books.push({ id:Date.now(), user:user, title:t, author:document.getElementById('in-a').value.toUpperCase(), year:document.getElementById('in-y').value, readDate:document.getElementById('in-d').value, cover:cov, fav:false, pend:false, rating:0, comment:"", pages:[] });
            await save(); closeModal(); render();
        }

        async function upBook() {
            const btn = event.target; btn.disabled=true; btn.innerText="Subiendo...";
            const b = books.find(x=>x.id===curId);
            const f = document.getElementById('ed-f').files[0]; if(f) b.cover = await uploadToBucket(f);
            b.title = document.getElementById('ed-t').value; b.author = document.getElementById('ed-a').value.toUpperCase();
            b.year = document.getElementById('ed-y').value; b.readDate = document.getElementById('ed-d').value;
            await save(); closeModal(); showDetail(curId); render();
        }

        async function saveComm() { books.find(x=>x.id===curId).comment = document.getElementById('ed-c').value; await save(); closeModal(); showDetail(curId); }
        async function saveProf() { const f=document.getElementById('np-f').files[0]; let a='👤'; if(f) a=await uploadToBucket(f); profiles.push({name:document.getElementById('np-n').value.toUpperCase(), avatar:a}); await save(); closeModal(); renderProfs(); }

        // --- PÁGINAS ---
        function openPages() {
            const b = books.find(x=>x.id===curId);
            let h = (b.pages||[]).map((p,i)=>`<div style="border-bottom:1px solid #333;padding:15px 0"><img src="${p.img}" style="width:100%;cursor:zoom-in" onclick="zoom('${p.img}')"><p>Página ${p.num}</p><button onclick="delPage(${i})" style="color:red;background:none;border:none">Borrar</button></div>`).join('');
            showModal(`<div style="background:#141414;width:100%;height:100%;overflow-y:auto;padding:20px"><h2>Páginas</h2><button onclick="addPagePrompt()" style="background:white;color:black;padding:10px;width:100%;border:none;border-radius:4px;margin-bottom:20px">+ Nueva Página</button>${h}<button onclick="closeModal()" style="margin-top:20px;width:100%;padding:15px;background:#333;color:white;border:none">Cerrar</button></div>`);
        }
        function addPagePrompt() { showModal(`<h2>Añadir Página</h2><input id="pg-n" type="number" placeholder="Nº"><textarea id="pg-c" placeholder="Nota"></textarea><input id="pg-f" type="file"><div class="modal-btns"><button onclick="openPages()" style="background:#444">Volver</button><button onclick="savePage()" style="background:var(--red)">Guardar</button></div>`); }
        async function savePage() { 
            const btn = event.target; btn.disabled=true; btn.innerText="Subiendo...";
            const f=document.getElementById('pg-f').files[0]; if(!f) return; const url=await uploadToBucket(f);
            books.find(x=>x.id===curId).pages.push({num:document.getElementById('pg-n').value, comm:document.getElementById('pg-c').value, img:url});
            await save(); openPages();
        }
        async function delPage(i) { if(confirm("¿Borrar?")) { books.find(x=>x.id===curId).pages.splice(i,1); await save(); openPages(); } }

        // --- UTILIDADES ---
        function closeModal() { document.getElementById('modal-wrapper').style.display='none'; }
        function closeDetail() { document.getElementById('detail-view').style.display='none'; document.getElementById('app-ui').style.display='grid'; render(); }
        function setFilter(f) { filter=f; render(); document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active')); document.getElementById('btn-'+f)?.classList.add('active'); }
        function doSort(k) { sortKey=k; render(); closeModal(); }
        function openComment() { openModal('comment'); }
        function openEdit() { openModal('edit'); }
        function openSort() { openModal('sort'); }
        async function toggleFav() { const b=books.find(x=>x.id===curId); b.fav=!b.fav; await save(); showDetail(curId); }
        async function togglePend() { const b=books.find(x=>x.id===curId); b.pend=!b.pend; await save(); showDetail(curId); }
        async function deleteBook() { if(confirm("¿Borrar?")) { books=books.filter(x=>x.id!==curId); await save(); closeDetail(); } }
        function logout() { localStorage.removeItem('bf_user'); location.reload(); }
        function zoom(url) { document.getElementById('zoom-img').src=url; document.getElementById('zoom-overlay').style.display='flex'; }
        
        function exportData() { const d = new Blob([JSON.stringify(books.filter(b=>b.user===user))], {type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(d); a.download='backup.json'; a.click(); }
        function importData(e) { const r=new FileReader(); r.onload=async ev=>{ const n=JSON.parse(ev.target.result); n.forEach(b=>b.user=user); books=[...books,...n]; await save(); render(); closeModal(); }; r.readAsText(e.target.files[0]); }

        init();
    </script>
</body>
</html>
