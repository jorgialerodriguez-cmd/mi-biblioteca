<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BookFlix Pro - Versión Definitiva</title>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.15.0/firebase-firestore-compat.js"></script>
    
    <style>
        :root { --bg-color: #141414; --sidebar-color: #000; --accent: #e50914; --text: white; --gray: #b3b3b3; --sidebar-width: 250px; }
        body { background: var(--bg-color); color: var(--text); font-family: 'Helvetica Neue', Arial; margin: 0; overflow: hidden; height: 100vh; }
        
        /* SELECCIÓN PERFILES */
        #profile-selection { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; background: var(--bg-color); position: fixed; width: 100%; top: 0; z-index: 2000; }
        .profiles-gate { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
        .profile-card { cursor: pointer; text-align: center; width: 120px; }
        .avatar { width: 120px; height: 120px; background: #333; border-radius: 4px; display: flex; justify-content: center; align-items: center; font-size: 60px; overflow: hidden; border: 3px solid transparent; transition: 0.2s; }
        .profile-card:hover .avatar { border: 3px solid white; transform: scale(1.05); }
        .avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* INTERFAZ PRINCIPAL */
        #main-interface { display: none; height: 100vh; grid-template-columns: var(--sidebar-width) 1fr; }
        
        /* SIDEBAR (PC) */
        .sidebar { background: var(--sidebar-color); padding: 30px 20px; border-right: 1px solid #333; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
        .sidebar-user { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }
        .sidebar-avatar { width: 100px; height: 100px; background: #333; border-radius: 4px; font-size: 50px; display: flex; justify-content: center; align-items: center; margin-bottom: 10px; overflow: hidden; border: 2px solid #444; }
        .sidebar-avatar img { width: 100%; height: 100%; object-fit: cover; }
        .sidebar-username { font-size: 1.2rem; font-weight: bold; text-align: center; }

        /* MÓVIL (LA VERSIÓN QUE TE GUSTA) */
        @media (max-width: 768px) {
            #main-interface { grid-template-columns: 1fr; }
            .sidebar { position: fixed; bottom: 0; left: 0; width: 100% !important; height: 75px; flex-direction: row; padding: 0; border-right: none; border-top: 1px solid #333; justify-content: space-around; align-items: center; background: #000; }
            .sidebar-user, .nav-text { display: none !important; }
            .nav-btn { width: auto !important; padding: 10px !important; margin: 0 !important; }
            .nav-btn span:first-child { font-size: 1.8rem !important; }
            #content-area { padding: 15px 15px 90px 15px !important; }
            .detail-layout { flex-direction: column !important; }
            .detail-left { width: 100% !important; height: 350px !important; }
            .detail-right { width: 100% !important; padding: 20px 0 !important; }
        }

        .nav-btn { background: transparent; border: none; color: var(--gray); text-align: left; padding: 15px 12px; font-size: 1.1rem; cursor: pointer; width: 100%; display: flex; align-items: center; gap: 15px; transition: 0.2s; border-radius: 8px; }
        .nav-btn:hover, .nav-btn.active { color: white; background: #222; }

        #content-area { padding: 40px; overflow-y: auto; position: relative; }
        .filter-bar { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 10px; margin-bottom: 20px; }
        .filter-bar select { background: #222; color: white; border: 1px solid #444; padding: 10px; border-radius: 4px; }

        .books-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 20px; }
        .book-card { background: #222; border-radius: 4px; cursor: pointer; height: 300px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid transparent; transition: 0.3s; }
        .book-card:hover { border-color: #666; transform: scale(1.02); }
        .book-cover { height: 220px; background: #333; display: flex; justify-content: center; align-items: center; font-size: 50px; overflow: hidden; }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; }

        #book-detail-view { display: none; height: 100%; width: 100%; position: absolute; top: 0; left: 0; background: var(--bg-color); z-index: 50; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .detail-layout { display: flex; max-width: 1200px; margin: 0 auto; gap: 40px; padding-top: 20px; }
        .detail-left { width: 40%; background: #000; display: flex; align-items: center; justify-content: center; border-radius: 8px; }
        .detail-left img { max-width: 95%; max-height: 95%; }
        .detail-right { width: 60%; display: flex; flex-direction: column; gap: 15px; }

        .action-icon { cursor: pointer; width: 35px; height: 35px; fill: none; stroke: white; stroke-width: 25px; }
        .active-heart { fill: #e50914 !important; stroke: #e50914 !important; }
        .active-mark { fill: #f1c40f !important; stroke: #f1c40f !important; }
        .active-pend { fill: #3498db !important; stroke: #3498db !important; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 3000; }
        .modal-content { background: #222; padding: 30px; border-radius: 8px; width: 450px; text-align: center; }
        .modal-content input, .modal-content textarea { width: 100%; padding: 12px; margin: 10px 0; background: #333; border: 1px solid #444; color: white; border-radius: 4px; box-sizing: border-box; }
        .btn-action { padding: 12px 20px; cursor: pointer; border-radius: 4px; border: none; font-weight: bold; }

        #zoom-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:black; z-index:4000; display:none; justify-content:center; align-items:center; }
        #zoom-overlay img { max-width: 95%; max-height: 95%; object-fit: contain; }
        .zoom-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.2); color: white; border: none; padding: 25px 15px; font-size: 2.5rem; cursor: pointer; border-radius: 10px; }
        .zoom-prev { left: 20px; } .zoom-next { right: 20px; }
    </style>
</head>
<body onload="initApp()">

    <div id="profile-selection">
        <h1 style="color: #e50914; font-size: 4rem; letter-spacing: 2px; font-weight: 900; margin-bottom: 40px;">BOOKFLIX</h1>
        <div class="profiles-gate" id="profiles-container"></div>
    </div>

    <div id="main-interface">
        <aside class="sidebar">
            <div class="sidebar-user">
                <div id="current-avatar" class="sidebar-avatar"></div>
                <div id="current-username" class="sidebar-username"></div>
            </div>
            <nav style="display: contents;">
                <button class="nav-btn active" id="side-all" onclick="setSideFilter('all')"><span>📚</span><span class="nav-text">Biblioteca</span></button>
                <button class="nav-btn" id="side-fav" onclick="setSideFilter('fav')"><span>❤️</span><span class="nav-text">Favoritos</span></button>
                <button class="nav-btn" id="side-mark" onclick="setSideFilter('mark')"><span>🔖</span><span class="nav-text">Marcados</span></button>
                <button class="nav-btn" id="side-pend" onclick="setSideFilter('pend')"><span>⏳</span><span class="nav-text">Pendientes</span></button>
                <button class="nav-btn" onclick="openProfileModal('edit')"><span>⚙️</span><span class="nav-text">Ajustes</span></button>
                <button class="nav-btn" onclick="logout()" style="color:#ff4444; margin-top: auto;"><span>🚪</span><span class="nav-text">Salir</span></button>
            </nav>
        </aside>

        <main id="content-area">
            <div class="filter-bar">
                <select id="filter-fav" onchange="renderBooks()"><option value="all">❤️ Todos</option><option value="true">Me gusta</option><option value="false">No me gusta</option></select>
                <select id="filter-mark" onchange="renderBooks()"><option value="all">🔖 Todos</option><option value="true">Guardados</option><option value="false">No guardados</option></select>
                <select id="filter-pend" onchange="renderBooks()"><option value="all">⏳ Todos</option><option value="true">Pendientes</option><option value="false">No pendientes</option></select>
                <button class="btn-action" style="background:#333; color:white;" onclick="openSortModal()">⇅</button>
            </div>

            <div id="books-grid-container"><div class="books-grid" id="books-grid"></div></div>
            
            <div id="book-detail-view">
                <button class="btn-action" style="background:#333; color:white; margin-bottom:20px;" onclick="closeBookDetail()">← Volver</button>
                <div class="detail-layout">
                    <div id="det-img-container" class="detail-left"></div>
                    <div class="detail-right">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <h1 id="det-title" style="margin:0; font-size: 3rem;"></h1>
                            <div style="display: flex; gap: 15px;">
                                <svg class="action-icon" id="heart-svg" onclick="toggleFavorite()" viewBox="0 0 512 512"><path d="M462.3 62.6C407.5 15.9 326 24.3 275.7 76.2L256 96.5l-19.7-20.3C186.1 24.3 104.5 15.9 49.7 62.6c-62.8 53.6-66.1 149.8-9.9 207.9l193.5 199.8c12.5 12.9 32.8 12.9 45.3 0l193.5-199.8c56.3-58.1 53-154.3-9.8-207.9z"/></svg>
                                <svg class="action-icon" id="mark-svg" onclick="toggleMark()" viewBox="0 0 384 512"><path d="M0 48V487.7C0 501.1 10.9 512 24.3 512c5 0 9.9-1.5 14-4.4L192 400L345.7 507.6c4.1 2.9 9 4.4 14 4.4c13.4 0 24.3-10.9 24.3-24.3V48c0-26.5-21.5-48-48-48H48C21.5 0 0 21.5 0 48z"/></svg>
                                <svg class="action-icon" id="pend-svg" onclick="togglePend()" viewBox="0 0 512 512"><path d="M256 0a256 256 0 1 1 0 512A256 256 0 1 1 256 0zM232 120V256c0 8 4 15.5 10.7 20l96 64c11 7.4 25.9 4.4 33.3-6.7s4.4-25.9-6.7-33.3L280 243.2V120c0-13.3-10.7-24-24-24s-24 10.7-24 24z"/></svg>
                            </div>
                        </div>
                        <h2 id="det-author" style="color:var(--gray); margin:0;"></h2>
                        <div id="star-container" style="display:flex; font-size: 2.5rem;"></div>
                        <div style="background:#222; padding:20px; border-radius:8px; position: relative;">
                            <button onclick="openEditCommentModal()" style="position:absolute; right:10px; top:10px; background:none; border:none; color:var(--gray); cursor:pointer;">✏️</button>
                            <p id="comment-text" style="white-space: pre-wrap; margin:0;"></p>
                        </div>
                        <button onclick="openAllPagesView()" class="btn-action" style="background:white; color:black; margin-top:10px;">Ver Páginas Destacadas</button>
                        <div style="margin-top:auto; display:flex; gap:10px;">
                            <button onclick="openEditBookModal()" class="btn-action" style="background:#444; color:white; flex:1;">Editar datos</button>
                            <button onclick="deleteBook()" style="color:#ff4444; background:none; border:1px solid #ff4444; padding:10px; cursor:pointer; flex:1;">Borrar</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div id="zoom-overlay">
        <button class="zoom-nav zoom-prev" onclick="changeZoomPage(-1)">❮</button>
        <img id="zoom-img" onclick="this.parentElement.style.display='none'">
        <button class="zoom-nav zoom-next" onclick="changeZoomPage(1)">❯</button>
    </div>
    <div id="modal-overlay" class="modal-overlay"><div id="modal-dynamic-content"></div></div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAoXp6vTOEhk3UCt-SmjNLmb2SUQaZERXc",
            authDomain: "bookflix-34356.firebaseapp.com",
            projectId: "bookflix-34356",
            storageBucket: "bookflix-34356.firebasestorage.app",
            messagingSenderId: "567651297193",
            appId: "1:567651297193:web:48175e8d3697d4d52686b8"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let allBooks = [], profiles = [], currentUser = "", currentBookId = null, currentZoomIdx = 0;

        async function initApp() {
            profiles = [{name: 'JORGE', avatar: '👦'}, {name: 'ALEJANDRA', avatar: '👧'}];
            renderProfiles();
            const doc = await db.collection('data').doc('library').get();
            if(doc.exists) {
                const d = doc.data();
                if(d.profiles) profiles = d.profiles;
                allBooks = d.books || [];
                renderProfiles();
            }
        }

        async function sync() { await db.collection('data').doc('library').set({ books: allBooks, profiles }); }

        function renderProfiles() {
            const c = document.getElementById('profiles-container'); c.innerHTML = '';
            profiles.forEach(p => {
                const div = document.createElement('div'); div.className = 'profile-card';
                div.onclick = () => accessProfile(p.name, p.avatar);
                div.innerHTML = `<div class="avatar">${p.avatar.startsWith('data') ? `<img src="${p.avatar}">` : p.avatar}</div><span style="display:block;margin-top:10px;font-weight:bold">${p.name}</span>`;
                c.appendChild(div);
            });
            const add = document.createElement('div'); add.className = 'profile-card';
            add.onclick = () => openProfileModal('create');
            add.innerHTML = `<div class="avatar">+</div><span style="display:block;margin-top:10px">Añadir</span>`;
            c.appendChild(add);
        }

        function accessProfile(name, avatar) {
            currentUser = name;
            document.getElementById('profile-selection').style.display = 'none';
            document.getElementById('main-interface').style.display = 'grid';
            document.getElementById('current-username').innerText = name;
            document.getElementById('current-avatar').innerHTML = avatar.startsWith('data') ? `<img src="${avatar}">` : avatar;
            renderBooks();
        }

        function setSideFilter(type) {
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('side-' + type).classList.add('active');
            document.getElementById('filter-fav').value = (type === 'fav') ? 'true' : 'all';
            document.getElementById('filter-mark').value = (type === 'mark') ? 'true' : 'all';
            document.getElementById('filter-pend').value = (type === 'pend') ? 'true' : 'all';
            closeBookDetail(); renderBooks();
        }

        function renderBooks() {
            const grid = document.getElementById('books-grid'); grid.innerHTML = '';
            const fFav = document.getElementById('filter-fav').value;
            const fMark = document.getElementById('filter-mark').value;
            const fPend = document.getElementById('filter-pend').value;

            let filtered = allBooks.filter(b => b.user === currentUser);
            if(fFav !== 'all') filtered = filtered.filter(b => b.favorite.toString() === fFav);
            if(fMark !== 'all') filtered = filtered.filter(b => b.marked.toString() === fMark);
            if(fPend !== 'all') filtered = filtered.filter(b => b.isPend.toString() === fPend);

            filtered.forEach(book => {
                const div = document.createElement('div'); div.className = 'book-card'; div.onclick = () => openBookDetail(book.id);
                div.innerHTML = `<div class="book-cover">${book.cover.startsWith('data') ? `<img src="${book.cover}">` : book.cover}</div><div style="padding:10px"><b>${book.title}</b><br><small>${book.author}</small></div>`;
                grid.appendChild(div);
            });
            const add = document.createElement('div'); add.className = 'book-card'; add.style.border="2px dashed #444"; add.style.display="flex"; add.style.justifyContent="center"; add.style.alignItems="center"; add.style.fontSize="40px"; add.innerText = '+'; add.onclick = openBookModal; grid.appendChild(add);
        }

        function openBookDetail(id) {
            currentBookId = id; const b = allBooks.find(x => x.id === id);
            document.getElementById('books-grid-container').style.display = 'none';
            document.getElementById('book-detail-view').style.display = 'block';
            document.getElementById('det-title').innerText = b.title;
            document.getElementById('det-author').innerText = b.author;
            document.getElementById('det-img-container').innerHTML = b.cover.startsWith('data') ? `<img src="${b.cover}">` : b.cover;
            document.getElementById('comment-text').innerText = b.comment || "Sin comentario.";
            document.getElementById('heart-svg').classList.toggle('active-heart', b.favorite);
            document.getElementById('mark-svg').classList.toggle('active-mark', b.marked);
            document.getElementById('pend-svg').classList.toggle('active-pend', b.isPend);
            renderStars(b.rating);
        }

        async function toggleFavorite() { const b = allBooks.find(x => x.id === currentBookId); b.favorite = !b.favorite; document.getElementById('heart-svg').classList.toggle('active-heart', b.favorite); await sync(); }
        async function toggleMark() { const b = allBooks.find(x => x.id === currentBookId); b.marked = !b.marked; document.getElementById('mark-svg').classList.toggle('active-mark', b.marked); await sync(); }
        async function togglePend() { const b = allBooks.find(x => x.id === currentBookId); b.isPend = !b.isPend; document.getElementById('pend-svg').classList.toggle('active-pend', b.isPend); await sync(); }

        function openBookModal() { showModal(`<div class="modal-content"><h2>Nuevo Libro</h2><input type="text" id="bt" placeholder="Título"><input type="text" id="ba" placeholder="Autor"><input type="text" id="by" placeholder="Año"><input type="file" id="bf" accept="image/*"><div style="display:flex;gap:10px;"><button onclick="closeModal()" class="btn-action" style="background:#444;flex:1">Cancelar</button><button onclick="saveBook()" class="btn-action" style="background:white;color:black;flex:2">Guardar</button></div></div>`); }
        async function saveBook() {
            const t = document.getElementById('bt').value, a = document.getElementById('ba').value.toUpperCase(), f = document.getElementById('bf').files[0];
            if(!t) return;
            let cov = '📖'; if(f) cov = await new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(f); });
            allBooks.push({ id: Date.now(), user: currentUser, title: t, author: a, cover: cov, year: document.getElementById('by').value, favorite: false, marked: false, isPend: false, rating: 0, comment: "", pages: [] });
            await sync(); renderBooks(); closeModal();
        }

        function exportData() {
            const data = allBooks.filter(b => b.user === currentUser);
            const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(data)], {type:"application/json"}));
            a.download = `BIBLIOTECA_${currentUser}.json`; a.click();
        }

        function logout() { document.getElementById('main-interface').style.display = 'none'; document.getElementById('profile-selection').style.display = 'flex'; }
        function closeModal() { document.getElementById('modal-overlay').style.display = 'none'; }
        function closeBookDetail() { document.getElementById('book-detail-view').style.display = 'none'; document.getElementById('books-grid-container').style.display = 'block'; renderBooks(); }
        function showModal(c, w = "450px") { const o = document.getElementById('modal-overlay'); const d = document.getElementById('modal-dynamic-content'); d.style.width = w; d.innerHTML = c; o.style.display = 'flex'; }
        
        // PÁGINAS Y ZOOM
        function openAllPagesView() { const b = allBooks.find(x => x.id === currentBookId); let content = (b.pages || []).map((p, i) => `<div class="page-scroll-item"><div class="psi-left" onclick="zoomImg(${i})"><img src="${p.img}"></div><div class="psi-right"><h1>Página ${p.num}</h1><p>${p.comm}</p><div style="display:flex;gap:10px;margin-top:auto"><button onclick="editP(${i})" class="btn-action" style="background:#444;color:white">Editar</button><button onclick="delP(${p.id})" class="btn-action" style="background:#e50914;">Borrar</button></div></div></div>`).join(''); showModal(`<div class="all-pages-view"><div style="display:flex;justify-content:space-between;align-items:center;"><h2>Páginas de ${b.title}</h2><div><button onclick="openAddPageModal()" class="btn-action" style="background:white;color:black;margin-right:10px;">Añadir</button><button onclick="closeModal()" class="btn-action" style="background:#444;">Volver</button></div></div>${content || '<p>No hay páginas.</p>'}</div>`, "95vw"); }
        function zoomImg(idx) { currentZoomIdx = idx; const b = allBooks.find(x => x.id === currentBookId); document.getElementById('zoom-img').src = b.pages[idx].img; document.getElementById('zoom-overlay').style.display = 'flex'; }
        function changeZoomPage(dir) { const b = allBooks.find(x => x.id === currentBookId); currentZoomIdx = (currentZoomIdx + dir + b.pages.length) % b.pages.length; document.getElementById('zoom-img').src = b.pages[currentZoomIdx].img; }
        
        function openEditCommentModal() { const b = allBooks.find(x => x.id === currentBookId); showModal(`<div class="modal-content"><h2>Comentario</h2><textarea id="nc" rows="6">${b.comment || ''}</textarea><button onclick="saveC()" class="btn-action" style="width:100%">Guardar</button></div>`); }
        async function saveC() { const b = allBooks.find(x => x.id === currentBookId); b.comment = document.getElementById('nc').value; document.getElementById('comment-text').innerText = b.comment; await sync(); closeModal(); }
        function editP(idx) { const b = allBooks.find(x => x.id === currentBookId); const p = b.pages[idx]; showModal(`<div class="modal-content"><h2>Editar</h2><input type="number" id="epn" value="${p.num}"><textarea id="epc">${p.comm}</textarea><button onclick="savePE(${idx})" class="btn-action" style="width:100%">OK</button></div>`); }
        async function savePE(idx) { const b = allBooks.find(x => x.id === currentBookId); b.pages[idx].num = document.getElementById('epn').value; b.pages[idx].comm = document.getElementById('epc').value; await sync(); openAllPagesView(); }
        async function delP(id) { if(confirm("¿Borrar?")) { const b = allBooks.find(x => x.id === currentBookId); b.pages = b.pages.filter(p => p.id !== id); await sync(); openAllPagesView(); } }
        function openAddPageModal() { showModal(`<div class="modal-content"><h2>Añadir Página</h2><input type="file" id="pf" accept="image/*"><input type="number" id="pn" placeholder="Nº"><textarea id="pc" placeholder="Nota"></textarea><button onclick="saveP()" class="btn-action" style="width:100%">OK</button></div>`); }
        async function saveP() { const f = document.getElementById('pf').files[0]; if(!f) return; let i = await new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsDataURL(f); }); allBooks.find(x => x.id === currentBookId).pages.push({id:Date.now(), num: document.getElementById('pn').value, comm: document.getElementById('pc').value, img: i}); await sync(); openAllPagesView(); }
        function openProfileModal(m) { const n = m === 'edit' ? currentUser : ""; showModal(`<div class="modal-content"><h2>Perfil</h2><input type="text" id="p_n" value="${n}"><div style="margin:10px 0;"><button onclick="exportData()" class="btn-action" style="background:#333;width:100%">Exportar Biblioteca</button></div><button onclick="saveProf('${m}')" class="btn-action" style="width:100%">Guardar</button></div>`); }
        async function saveProf(m) { const n = document.getElementById('p_n').value.toUpperCase(); if(!n) return; if(m === 'edit') { const idx = profiles.findIndex(p => p.name === currentUser); profiles[idx].name = n; currentUser = n; } else { profiles.push({name:n, avatar:'👤'}); } await sync(); renderProfiles(); closeModal(); }
        function openSortModal() { showModal(`<div class="modal-content"><h2>Ordenar</h2><button onclick="sortB('title')" class="nav-btn">Título</button><button onclick="sortB('author')" class="nav-btn">Autor</button><button onclick="closeModal()" class="btn-action" style="width:100%;margin-top:10px">Cerrar</button></div>`); }
        function sortB(k) { allBooks.sort((a,b) => a[k].localeCompare(b[k])); renderBooks(); closeModal(); }
        function renderStars(r) { const c = document.getElementById('star-container'); c.innerHTML = ''; for(let i=1; i<=5; i++) { const w = document.createElement('div'); w.className = 'star-wrapper'; w.innerHTML = '★'; const f = document.createElement('div'); f.className = 'star-full'; f.innerHTML = '★'; if(r >= i) f.style.width = '100%'; w.appendChild(f); w.onclick = () => { allBooks.find(b => b.id === currentBookId).rating = i; sync(); renderStars(i); }; c.appendChild(w); } }
        function openEditBookModal() { const b = allBooks.find(x => x.id === currentBookId); showModal(`<div class="modal-content"><h2>Editar</h2><input type="text" id="et" value="${b.title}"><input type="text" id="ea" value="${b.author}"><input type="text" id="ey" value="${b.year}"><button onclick="upB()" class="btn-action" style="width:100%">Actualizar</button></div>`); }
        async function upB() { const b = allBooks.find(x => x.id === currentBookId); b.title = document.getElementById('et').value; b.author = document.getElementById('ea').value.toUpperCase(); b.year = document.getElementById('ey').value; await sync(); openBookDetail(currentBookId); renderBooks(); closeModal(); }
        async function deleteBook() { if(confirm("¿Borrar?")) { allBooks = allBooks.filter(b => b.id !== currentBookId); await sync(); closeBookDetail(); } }
    </script>
</body>
</html>
